name: Aplicar Consultar estoque agora

# Segunda gravação intencional: dispara o workflow já existente na main.
# Disparo final solicitado em 22/08/2026.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stock-editor-trigger.yml

permissions:
  contents: write

concurrency:
  group: stock-editor-final-patch
  cancel-in-progress: false

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extrair patch
        shell: bash
        run: |
          awk '/node <<'"'"'NODE'"'"'/{captura=1; next} /^          NODE$/{captura=0} captura{sub(/^          /, ""); print}' .github/workflows/stock-editor-patch.yml > /tmp/stock-editor-patch.js
          test -s /tmp/stock-editor-patch.js
          node <<'FIX'
          const fs = require('fs');
          const arquivo = '/tmp/stock-editor-patch.js';
          let patch = fs.readFileSync(arquivo, 'utf8');
          patch = patch.replaceAll(
            'async function aplicarEdicaoNo()',
            'async function aplicarEdicaoNoInterno()'
          );
          patch = patch.replace(
            '${22 + index * 19}',
            '\\${22 + index * 19}'
          );
          fs.writeFileSync(arquivo, patch);
          FIX
          node /tmp/stock-editor-patch.js

      - name: Instalar dependencias
        run: npm ci

      - name: Validar ESLint
        run: npx eslint 'src/app/(private)/fluxos/page.tsx' 'src/components/automacoes/ConsultarEstoqueConfig.tsx' 'src/app/api/automacoes/estoque/opcoes/route.ts'

      - name: Validar TypeScript
        run: npx tsc --noEmit

      - name: Validar build Next.js
        run: npm run build

      - name: Publicar alteracao final
        shell: bash
        run: |
          rm .github/workflows/stock-editor-patch.yml
          rm .github/workflows/stock-editor-scheduler.yml
          rm .github/workflows/stock-editor-trigger.yml
          git config user.name "L34n7"
          git config user.email "86571901+L34n7@users.noreply.github.com"
          git add 'src/app/(private)/fluxos/page.tsx' .github/workflows/stock-editor-patch.yml .github/workflows/stock-editor-scheduler.yml .github/workflows/stock-editor-trigger.yml
          git commit -m 'feat: adicionar no consultar estoque ao construtor'
          git push origin HEAD:main
