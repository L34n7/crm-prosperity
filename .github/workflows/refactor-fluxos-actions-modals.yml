name: Integrar acoes e modais dos fluxos

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/fluxos-editor-estrutura
          fetch-depth: 0

      - name: Conectar acoes e modais extraidos
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/app/(private)/fluxos/FluxosEditor.tsx';
          let source = fs.readFileSync(path, 'utf8');

          const importNeedle = 'import DelayConfig from "./components/node-config/DelayConfig";';
          const imports = [
            'import NodeActions from "./components/node-config/NodeActions";',
            'import IaTokenEstimateModal from "./components/modals/IaTokenEstimateModal";',
            'import DisparoCostConfirmModal from "./components/modals/DisparoCostConfirmModal";',
          ];
          if (!source.includes(importNeedle)) throw new Error('Import base nao encontrado');
          for (const line of imports) {
            if (!source.includes(line)) {
              source = source.replace(importNeedle, `${importNeedle}\n${line}`);
            }
          }

          const actionStart = source.indexOf('<div className={styles.actionButtonsRow}>', source.indexOf('<NodeConfigPanel'));
          const panelClose = source.indexOf('</NodeConfigPanel>', actionStart);
          if (actionStart < 0 || panelClose < 0) throw new Error('Acoes inline nao encontradas');

          const actionReplacement = `<NodeActions
                    podeExcluir={nodeEditado.data?.tipo_no !== "inicio"}
                    confirmandoExclusao={confirmandoExclusaoNo}
                    onPedirExclusao={() => setConfirmandoExclusaoNo(true)}
                    onConfirmarExclusao={() => removerNode(nodeEditado.id)}
                    onCancelar={fecharPainelEdicao}
                    onAplicar={aplicarEdicaoNo}
                  />\n\n                `;
          source = source.slice(0, actionStart) + actionReplacement + source.slice(panelClose);

          const iaStartMarker = '        {previaGeracaoDescricaoIa && (';
          const costStartMarker = '        {mostrarModalCustoAgendamento && (';
          const assistantMarker = '        {assistenteFluxosAberto && (';
          const iaStart = source.indexOf(iaStartMarker);
          const costStart = source.indexOf(costStartMarker, iaStart);
          if (iaStart < 0 || costStart < 0) throw new Error('Modal IA inline nao encontrado');

          const iaReplacement = `        {previaGeracaoDescricaoIa && (
          <IaTokenEstimateModal
            previa={previaGeracaoDescricaoIa}
            processando={gerandoDescricaoIaConexao || gerandoDescricoesIaBloco}
            formatarTokens={formatarTokens}
            onCancelar={cancelarPreviaGeracaoDescricaoIa}
            onConfirmar={confirmarPreviaGeracaoDescricaoIa}
          />
        )}\n\n`;
          source = source.slice(0, iaStart) + iaReplacement + source.slice(costStart);

          const costStart2 = source.indexOf(costStartMarker, source.indexOf('<IaTokenEstimateModal'));
          const assistantStart = source.indexOf(assistantMarker, costStart2);
          if (costStart2 < 0 || assistantStart < 0) throw new Error('Modal custo inline nao encontrado');

          const costReplacement = `        {mostrarModalCustoAgendamento && (
          <DisparoCostConfirmModal
            custo={previewCustoAgendarDisparo}
            onCancelar={() => {
              setMostrarModalCustoAgendamento(false);
              setAcaoPendenteAplicarNo(null);
            }}
            onConfirmar={() => {
              setMostrarModalCustoAgendamento(false);

              if (acaoPendenteAplicarNo) {
                acaoPendenteAplicarNo();
              }

              setAcaoPendenteAplicarNo(null);
            }}
          />
        )}\n\n`;
          source = source.slice(0, costStart2) + costReplacement + source.slice(assistantStart);

          if (!source.includes('<NodeActions')) throw new Error('NodeActions nao conectado');
          if (!source.includes('podeExcluir={nodeEditado.data?.tipo_no !== "inicio"}')) throw new Error('Regra de exclusao nao preservada');
          if (source.includes('<div className={styles.actionButtonsRow}>')) throw new Error('Acoes inline ainda presentes');
          if (!source.includes('<IaTokenEstimateModal')) throw new Error('Modal IA nao conectado');
          if (!source.includes('<DisparoCostConfirmModal')) throw new Error('Modal custo nao conectado');
          if (source.includes('{previaGeracaoDescricaoIa && (\n          <div className={styles.modalOverlay}>')) throw new Error('Modal IA inline ainda presente');
          if (source.includes('{mostrarModalCustoAgendamento && (\n          <div className={styles.modalOverlay}>')) throw new Error('Modal custo inline ainda presente');

          fs.writeFileSync(path, source);
          NODE

      - name: Registrar mudanca e remover workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refactor-fluxos-actions-modals.yml
          git add 'src/app/(private)/fluxos/FluxosEditor.tsx'
          git commit -m 'refactor: conectar acoes e modais extraidos dos fluxos'
          git push origin HEAD:refactor/fluxos-editor-estrutura
