name: Restaurar guards dos configs de blocos

on:
  push:
    branches:
      - refactor/fluxos-editor-estrutura
    paths:
      - .github/workflows/fix-fluxos-node-config-guards.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/fluxos-editor-estrutura
          fetch-depth: 0

      - name: Restaurar condicionais dos configs
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/app/(private)/fluxos/FluxosEditor.tsx';
          let source = fs.readFileSync(path, 'utf8');
          const panelIndex = source.indexOf('<PropertiesPanel');
          if (panelIndex < 0) throw new Error('PropertiesPanel nao encontrado');

          function wrapBlock(startMarker, nextMarker, condition) {
            const start = source.indexOf(startMarker, panelIndex);
            const next = source.indexOf(nextMarker, start + startMarker.length);
            if (start < 0 || next < 0) throw new Error(`Bloco nao encontrado: ${startMarker}`);
            const raw = source.slice(start, next).trimEnd();
            if (raw.trimStart().startsWith(`{${condition} && (`)) return;
            const indent = '                  ';
            const block = raw.trim();
            const wrapped = `${indent}{${condition} && (\n${indent}  ${block.replace(/\n/g, `\n${indent}  `)}\n${indent})}\n\n${indent}`;
            source = source.slice(0, start) + wrapped + source.slice(next);
          }

          wrapBlock('<EncerrarConfig', '<CapturarRespostaConfig', 'tipoNodeEdicao === "encerrar"');
          wrapBlock('<CapturarRespostaConfig', '<AvaliacaoConfig', 'tipoNodeEdicao === "capturar_resposta"');
          wrapBlock('<AvaliacaoConfig', '{[\n                    "enviar_imagem",', 'tipoNodeEdicao === "avaliacao"');
          wrapBlock('<PerguntaOpcoesConfig', '<BotoesConfig', 'tipoNodeEdicao === "pergunta_opcoes"');
          wrapBlock('<BotoesConfig', '<RedirectConfig', 'tipoNodeEdicao === "enviar_botoes"');
          wrapBlock('<RedirectConfig', '{tipoNodeEdicao === "agendar_disparo" && (', 'tipoNodeEdicao === "botao_redirect"');
          wrapBlock('<InterpretarArquivoIaConfig', '{nodeEditadoPermiteGerarDescricoesIa && (', 'tipoNodeEdicao === "interpretar_arquivo_ia"');
          wrapBlock('<TransferenciaConfig', '{tipoNodeEdicao !== "inicio" && tipoNodeEdicao !== "agendar_disparo" && (', 'tipoNodeEdicao === "transferir_setor"');

          const checks = [
            ['encerrar', '<EncerrarConfig'],
            ['capturar_resposta', '<CapturarRespostaConfig'],
            ['avaliacao', '<AvaliacaoConfig'],
            ['pergunta_opcoes', '<PerguntaOpcoesConfig'],
            ['enviar_botoes', '<BotoesConfig'],
            ['botao_redirect', '<RedirectConfig'],
            ['interpretar_arquivo_ia', '<InterpretarArquivoIaConfig'],
            ['transferir_setor', '<TransferenciaConfig'],
          ];
          for (const [tipo, component] of checks) {
            const idx = source.indexOf(component, panelIndex);
            const prefix = source.slice(Math.max(panelIndex, idx - 120), idx);
            if (!prefix.includes(`tipoNodeEdicao === "${tipo}"`)) {
              throw new Error(`Guard nao restaurado para ${tipo}`);
            }
          }

          fs.writeFileSync(path, source);
          NODE

      - name: Registrar correcao e remover workflow temporario
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-fluxos-node-config-guards.yml
          git add 'src/app/(private)/fluxos/FluxosEditor.tsx'
          git commit -m 'fix: restaurar condicionais dos configs de blocos'
          git push origin HEAD:refactor/fluxos-editor-estrutura
