# Execução da migração para implementação nativa
name: Aplicar campos nativos de captura na conversa

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-native-capture-fields.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refazer implementação nativa
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          page_path = Path('src/app/(private)/conversas/page.tsx')
          layout_path = Path('src/app/(private)/conversas/layout.tsx')
          old_component_path = Path('src/app/(private)/conversas/CaptureInfoPanelVisible.tsx')
          workflow_path = Path('.github/workflows/tmp-native-capture-fields.yml')

          page = page_path.read_text(encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: esperado 1 trecho, encontrado {count}')
              return text.replace(old, new, 1)

          type_anchor = '''type IntegracaoWhatsappOpcao = {'''
          type_block = '''type InformacaoCapturaConversa = {
  id: string;
  tipo?: string | null;
  nome_campo?: string | null;
  sequencia?: number | null;
  valor: string;
  capturado_em?: string | null;
};

function normalizarLabelCaptura(valor: string | null | undefined) {
  return String(valor || "")
    .normalize("NFD")
    .replace(/[\\u0300-\\u036f]/g, "")
    .toLowerCase()
    .replace(/\\s+/g, " ")
    .trim();
}

function formatarLabelCaptura(informacao: InformacaoCapturaConversa) {
  const nomeOriginal = String(
    informacao.nome_campo || informacao.tipo || "Informação"
  )
    .replace(/[_-]+/g, " ")
    .replace(/\\s+/g, " ")
    .trim();
  const correspondencia = nomeOriginal.match(/^(.*?)(?:\\s+(\\d+))?$/);
  const baseBruta = correspondencia?.[1]?.trim() || "Informação";
  const numeroNome = correspondencia?.[2] || "";
  const baseNormalizada = normalizarLabelCaptura(baseBruta);
  const base =
    baseNormalizada === "email" || baseNormalizada === "e mail"
      ? "E-mail"
      : baseBruta.charAt(0).toUpperCase() + baseBruta.slice(1);
  const sequencia =
    numeroNome ||
    (Number(informacao.sequencia || 0) > 0
      ? String(informacao.sequencia)
      : "");

  return `${base} captura${sequencia ? ` ${sequencia}` : ""}`;
}

''' + type_anchor
          page = replace_once(page, type_anchor, type_block, 'tipo e helpers de captura')

          state_anchor = '''  const [painelDireitoAberto, setPainelDireitoAberto] = useState(false);
  const [abaPainelDireito, setAbaPainelDireito] =
    useState<AbaPainelDireito>("contato");'''
          state_block = state_anchor + '''
  const [informacoesCapturaConversa, setInformacoesCapturaConversa] = useState<
    InformacaoCapturaConversa[]
  >([]);

  const informacoesCapturaConversaOrdenadas = useMemo(
    () =>
      [...informacoesCapturaConversa]
        .filter((informacao) => String(informacao.valor || "").trim())
        .sort((a, b) =>
          formatarLabelCaptura(a).localeCompare(formatarLabelCaptura(b), "pt-BR", {
            numeric: true,
            sensitivity: "base",
          })
        ),
    [informacoesCapturaConversa]
  );'''
          page = replace_once(page, state_anchor, state_block, 'estado de captura')

          effect_anchor = '''  function abrirConversa(conversa: Conversa) {'''
          effect_block = '''  useEffect(() => {
    const conversaId = conversaSelecionada?.id || "";
    const controller = new AbortController();

    setInformacoesCapturaConversa([]);
    if (!conversaId) return () => controller.abort();

    void (async () => {
      try {
        const response = await fetch(
          `/api/conversas/${encodeURIComponent(
            conversaId
          )}/informacoes-captura`,
          {
            cache: "no-store",
            signal: controller.signal,
          }
        );
        const data = await response.json().catch(() => ({}));

        if (!response.ok || data?.ok === false) {
          throw new Error(
            data?.error || "Erro ao carregar informações de captura."
          );
        }

        if (controller.signal.aborted) return;
        setInformacoesCapturaConversa(
          Array.isArray(data.informacoes)
            ? data.informacoes.filter(
                (informacao: InformacaoCapturaConversa) =>
                  Boolean(String(informacao?.valor || "").trim())
              )
            : []
        );
      } catch (error) {
        if (controller.signal.aborted) return;
        setInformacoesCapturaConversa([]);
        console.error("[capturas-conversa]", error);
      }
    })();

    return () => controller.abort();
  }, [conversaSelecionada?.id]);

''' + effect_anchor
          page = replace_once(page, effect_anchor, effect_block, 'carregamento nativo de capturas')

          observacoes = '''                              <CampoContatoEditavel
                                label="OBSERVAÇÕES"
                                valorInicial={conversaSelecionada.contatos?.observacoes || ""}
                                editando={editandoCampo === "observacoes"}
                                multiline
                                onEditar={() => setEditandoCampo("observacoes")}
                                onCancelar={() => setEditandoCampo(null)}
                                onSalvar={(valor) => salvarContatoCampo("observacoes", valor)}
                              />'''
          captura_jsx = observacoes + '''

                              {informacoesCapturaConversaOrdenadas.map(
                                (informacao) => (
                                  <div
                                    className={styles.whatsInfoRow}
                                    key={informacao.id}
                                  >
                                    <span className={styles.whatsInfoLabel}>
                                      {formatarLabelCaptura(informacao)}
                                    </span>
                                    <strong className={styles.whatsInfoValue}>
                                      {informacao.valor}
                                    </strong>
                                  </div>
                                )
                              )}'''
          page = replace_once(
              page,
              observacoes,
              captura_jsx,
              'campos nativos abaixo de observações',
          )

          page_path.write_text(page, encoding='utf-8')

          layout_path.write_text(
              '''import { type ReactNode } from "react";
import ConteudoIndisponivelAlignment from "./ConteudoIndisponivelAlignment";

export default function ConversasLayout({ children }: { children: ReactNode }) {
  return (
    <>
      <ConteudoIndisponivelAlignment />
      {children}
    </>
  );
}
''',
              encoding='utf-8',
          )

          if old_component_path.exists():
              old_component_path.unlink()
          if workflow_path.exists():
              workflow_path.unlink()
          PY

      - name: Validar build
        run: npm ci && npm run build

      - name: Publicar implementação
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refazer campos de captura na página de conversas"
          git push origin main
