name: Fix fluxo editor header narrowing

on:
  push:
    branches:
      - refactor/fluxos-editor-estrutura

permissions:
  contents: write

jobs:
  fix-header:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/fluxos-editor-estrutura
          fetch-depth: 0

      - name: Fix redundant archived comparison
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/app/(private)/fluxos/components/FluxoEditorHeader.tsx")
          text = path.read_text(encoding="utf-8")
          old = '''                fluxoSelecionado.status !== "ativo" &&
                fluxoSelecionado.status !== "arquivado" && (
'''
          new = '''                fluxoSelecionado.status !== "ativo" && (
'''
          if text.count(old) != 1:
              raise RuntimeError("Expected header narrowing block not found exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          workflow = Path(".github/workflows/fix-fluxo-editor-header.yml")
          if workflow.exists():
              workflow.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "fix: ajustar narrowing de status no header de fluxos"
          git push origin HEAD:refactor/fluxos-editor-estrutura
