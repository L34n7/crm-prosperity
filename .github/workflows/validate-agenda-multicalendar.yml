name: Validate Agenda Multicalendar

on:
  push:
    branches:
      - validate/agenda-capacidade-multicalendario
  workflow_dispatch:

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript diagnostics
        continue-on-error: true
        run: npx tsc --noEmit --pretty false
      - name: Next production build
        run: npm run build
