name: Apply individual send fixes v2

on:
  push:
    branches:
      - feature/agendamento-mensagens-conversas

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/agendamento-mensagens-conversas

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply TypeScript fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceOnce(text, from, to, label) {
            const first = text.indexOf(from);
            if (first < 0) throw new Error(`Trecho não encontrado: ${label}`);
            if (text.indexOf(from, first + from.length) >= 0) {
              throw new Error(`Trecho duplicado inesperadamente: ${label}`);
            }
            return text.slice(0, first) + to + text.slice(first + from.length);
          }

          const routePath = 'src/app/api/whatsapp/disparo-individual/route.ts';
          let route = fs.readFileSync(routePath, 'utf8');

          route = replaceOnce(
            route,
            `    const setorDoUsuario = obterSetorPrincipalDoUsuario(usuario);\n\n    if (!setorDoUsuario) {\n      return NextResponse.json(\n        { ok: false, error: "Usuário sem setor vinculado para reabrir a conversa" },\n        { status: 400 }\n      );\n    }\n\n`,
            '',
            'bloqueio de setor do disparo individual'
          );

          route = replaceOnce(
            route,
            `    const { data: conversa, error: conversaError } = await supabaseAdmin\n      .from("conversas")\n      .select(\`\n        id,\n        empresa_id,\n        integracao_whatsapp_id,`,
            `    const { data: conversa, error: conversaError } = await supabaseAdmin\n      .from("conversas")\n      .select(\`\n        id,\n        empresa_id,\n        setor_id,\n        integracao_whatsapp_id,`,
            'select setor_id da conversa'
          );

          route = replaceOnce(
            route,
            `    await encerrarProtocolosAtivosDaConversa(conversa.id);\n\n    await reabrirConversaAposDisparo({\n      conversaId: conversa.id,\n      usuarioId: usuario.id,\n      setorId: setorDoUsuario,\n    });`,
            `    const setorReabertura =\n      (typeof conversa.setor_id === "string" && conversa.setor_id.trim()\n        ? conversa.setor_id\n        : obterSetorPrincipalDoUsuario(usuario)) || null;\n\n    await encerrarProtocolosAtivosDaConversa(conversa.id);\n\n    await reabrirConversaAposDisparo({\n      conversaId: conversa.id,\n      usuarioId: usuario.id,\n      setorId: setorReabertura,\n    });`,
            'setor de reabertura'
          );

          fs.writeFileSync(routePath, route);

          const pagePath = 'src/app/(private)/conversas/page.tsx';
          let page = fs.readFileSync(pagePath, 'utf8');

          page = replaceOnce(
            page,
            `import AgendarMensagemButton from "./AgendarMensagemButton";\nimport VirtualizedConversationRows from "./VirtualizedConversationRows";`,
            `import AgendarMensagemButton from "./AgendarMensagemButton";\nimport TemplateVariableSearchSelect, {\n  type TemplateVariableOption,\n} from "@/components/TemplateVariableSearchSelect";\nimport VirtualizedConversationRows from "./VirtualizedConversationRows";`,
            'import do seletor de variáveis'
          );

          const memoBase = `  const variaveisCustomizadasMacro = useMemo(() => {\n    return variaveisGlobais\n      .filter((variavel) => variavel.ativo !== false)\n      .sort((a, b) => a.chave.localeCompare(b.chave));\n  }, [variaveisGlobais]);`;
          const memoNovo = `${memoBase}\n\n  const opcoesVariaveisDisparoIndividual = useMemo<TemplateVariableOption[]>(() => {\n    const chavesAdicionadas = new Set<string>();\n    const opcoes: TemplateVariableOption[] = [];\n\n    for (const variavel of VARIAVEIS_FIXAS_SISTEMA) {\n      const chave = normalizarChaveVariavelMacro(variavel.chave);\n      if (!chave || chavesAdicionadas.has(chave)) continue;\n      chavesAdicionadas.add(chave);\n      opcoes.push({\n        chave,\n        descricao: variavel.descricao,\n        categoria: "Fixa",\n      });\n    }\n\n    for (const variavel of variaveisCustomizadasMacro) {\n      if (variavel.escopo && !["global", "disparos"].includes(variavel.escopo)) continue;\n      const chave = normalizarChaveVariavelMacro(variavel.chave);\n      if (!chave || chavesAdicionadas.has(chave)) continue;\n      chavesAdicionadas.add(chave);\n      opcoes.push({\n        chave,\n        descricao: variavel.descricao || "Variável personalizada cadastrada no CRM.",\n        categoria: "Personalizada",\n      });\n    }\n\n    return opcoes;\n  }, [variaveisCustomizadasMacro]);`;
          page = replaceOnce(page, memoBase, memoNovo, 'opções de variáveis do disparo individual');

          page = replaceOnce(
            page,
            `  useEffect(() => {\n    if (!mostrarDisparoIndividual) return;\n    if (!conversaSelecionada?.integracao_whatsapp_id) return;\n\n    carregarTemplatesWhatsapp();\n  }, [mostrarDisparoIndividual, conversaSelecionada?.integracao_whatsapp_id]);`,
            `  useEffect(() => {\n    if (!mostrarDisparoIndividual) return;\n    if (!conversaSelecionada?.integracao_whatsapp_id) return;\n\n    carregarTemplatesWhatsapp();\n    void carregarVariaveisGlobais();\n  }, [mostrarDisparoIndividual, conversaSelecionada?.integracao_whatsapp_id]);`,
            'carregamento de variáveis do disparo individual'
          );

          page = replaceOnce(
            page,
            `    if (bloqueioLimiteDisparoIndividual) {\n      setErro(\n        "Este disparo ultrapassaria o limite de novas conversas permitido pela Meta nas ultimas 24 horas. Aguarde liberar saldo ou revise o limite no Gerenciador do WhatsApp."\n      );\n      return;\n    }\n\n    try {`,
            `    if (bloqueioLimiteDisparoIndividual) {\n      setErro(\n        "Este disparo ultrapassaria o limite de novas conversas permitido pela Meta nas ultimas 24 horas. Aguarde liberar saldo ou revise o limite no Gerenciador do WhatsApp."\n      );\n      return;\n    }\n\n    const parametrosSelecionados = Array.from(\n      { length: quantidadeParametrosBody },\n      (_, index) => String(parametros[index] || "").trim()\n    );\n\n    if (parametrosSelecionados.some((item) => !item)) {\n      setErro("Selecione uma variável para cada parâmetro exigido pelo template.");\n      return;\n    }\n\n    const parametrosResolvidos = parametrosSelecionados.map((chave) =>\n      resolverVariaveisMacro(\`{{\${chave}}}\`)\n    );\n\n    try {`,
            'validação e resolução das variáveis'
          );

          page = replaceOnce(
            page,
            `          body_params: parametros.filter((item) => item.trim() !== ""),`,
            `          body_params: parametrosResolvidos,`,
            'body_params resolvidos'
          );

          page = replaceOnce(
            page,
            `                                        {Array.from({ length: quantidadeParametrosBody }).map((_, i) => (\n                                          <input\n                                            key={i}\n                                            className={styles.disparoInput}\n                                            placeholder={\`Parâmetro \${i + 1}\`}\n                                            value={parametros[i] || ""}\n                                            onChange={(e) => atualizarParametro(i, e.target.value)}\n                                          />\n                                        ))}`,
            `                                        {Array.from({ length: quantidadeParametrosBody }).map((_, i) => (\n                                          <TemplateVariableSearchSelect\n                                            key={i}\n                                            label={\`Variável \${i + 1}\`}\n                                            value={parametros[i] || ""}\n                                            onChange={(chave) => atualizarParametro(i, chave)}\n                                            opcoes={opcoesVariaveisDisparoIndividual}\n                                            carregando={carregandoVariaveis}\n                                          />\n                                        ))}`,
            'campos pesquisáveis das variáveis'
          );

          fs.writeFileSync(pagePath, page);
          NODE

      - name: Validate changes
        shell: bash
        run: |
          git diff --check
          npx tsc --noEmit > /tmp/tsc.log 2>&1 || true
          grep "error TS" /tmp/tsc.log > /tmp/tsc-errors.log || true
          grep -Ev '^(tests/assistente-fluxos-planejamento\.test\.mts|tests/assistente-fluxos-resiliencia\.test\.mts)' /tmp/tsc-errors.log > /tmp/unexpected-tsc-errors.log || true
          if [ -s /tmp/unexpected-tsc-errors.log ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            cp /tmp/tsc.log .github/tsc-error.txt
            git add .github/tsc-error.txt
            git commit -m "chore: registrar erro temporario do tsc"
            git push origin feature/agendamento-mensagens-conversas
            cat /tmp/unexpected-tsc-errors.log
            exit 1
          fi

      - name: Commit source changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/whatsapp/disparo-individual/route.ts src/app/'(private)'/conversas/page.tsx
          git rm -f .github/tsc-error.txt || true
          git rm .github/workflows/apply-disparo-individual-variable-fix-v2.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: corrigir disparo individual e seletor de variaveis"
          git push origin feature/agendamento-mensagens-conversas
