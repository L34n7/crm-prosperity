name: Integrar NodeConfigPanel dos fluxos

on:
  push:
    branches:
      - refactor/fluxos-editor-estrutura
    paths:
      - .github/workflows/refactor-fluxos-node-config-panel.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/fluxos-editor-estrutura
          fetch-depth: 0

      - name: Conectar NodeConfigPanel
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/app/(private)/fluxos/FluxosEditor.tsx';
          let source = fs.readFileSync(path, 'utf8');

          const importNeedle = 'import InterpretarArquivoIaConfig from "./components/node-config/InterpretarArquivoIaConfig";';
          const importLine = 'import NodeConfigPanel from "./components/node-config/NodeConfigPanel";';
          if (!source.includes(importLine)) {
            if (!source.includes(importNeedle)) throw new Error('Import base nao encontrado');
            source = source.replace(importNeedle, `${importNeedle}\n${importLine}`);
          }

          const propertiesIndex = source.indexOf('<PropertiesPanel');
          const nodeBranchIndex = source.indexOf('{nodeEditado ? (', propertiesIndex);
          const formStart = source.indexOf('<div className={styles.propertiesForm}>', nodeBranchIndex);
          const encerrarCondition = source.indexOf('tipoNodeEdicao === "encerrar" && (', formStart);
          const childrenStart = source.lastIndexOf('{', encerrarCondition);
          if (propertiesIndex < 0 || nodeBranchIndex < 0 || formStart < 0 || encerrarCondition < 0 || childrenStart < 0) {
            throw new Error('Inicio do formulario de bloco nao encontrado');
          }

          const panelOpen = `<NodeConfigPanel
                  tipoNode={tipoNodeEdicao}
                  titulo={tituloNode}
                  mensagem={mensagemNode}
                  onTipoChange={(novoTipo) => {
                    const tipoAnterior = tipoNodeEdicao;

                    setTipoNodeEdicao(novoTipo);

                    if (tituloEhPadraoDoSistema(tituloNode, tipoAnterior)) {
                      setTituloNode(tituloPadraoTipoNo(novoTipo));
                    }

                    if (novoTipo === "encerrar") {
                      setMensagemNode("");
                      setSetorDestino("");
                      setOpcoesNode([]);
                      setEncerrarResultadoNode("positivo");
                      setEncerrarValorTipoNode("sem_valor");
                      setEncerrarValorFixoNode("");
                      setEncerrarValorVariavelNode("");
                    }

                    if (novoTipo === "transferir_setor") {
                      setSetorDestino("");
                      setOpcoesNode([]);
                    }

                    if (novoTipo === "enviar_texto") {
                      setSetorDestino("");
                      setOpcoesNode([]);
                      setBotoesNode([]);
                    }

                    if (novoTipo === "pergunta_opcoes") {
                      setSetorDestino("");
                      setBotoesNode([]);
                    }

                    if (novoTipo === TIPO_NO_PERGUNTA_LIVRE_IA) {
                      setSetorDestino("");
                      setOpcoesNode([]);
                      setBotoesNode([]);

                      if (!mensagemNode.trim()) {
                        setMensagemNode("Como posso te ajudar?");
                      }
                    }

                    if (novoTipo === "enviar_botoes") {
                      setSetorDestino("");
                      setOpcoesNode([]);

                      if (botoesNode.length === 0) {
                        setBotoesNode([
                          { id: "sim", titulo: "Sim" },
                          { id: "nao", titulo: "Não" },
                        ]);
                      }
                    }

                    if (novoTipo === "botao_redirect") {
                      setSetorDestino("");
                      setOpcoesNode([]);
                      setBotoesNode([]);
                      setMidiaUrlNode("");

                      if (!redirectBotaoTextoNode.trim()) {
                        setRedirectBotaoTextoNode("Acessar");
                      }

                      if (!redirectUrlNode.trim()) {
                        setRedirectUrlNode("https://");
                      }
                    }

                    if (
                      novoTipo === "enviar_imagem" ||
                      novoTipo === "enviar_video" ||
                      novoTipo === "enviar_audio" ||
                      novoTipo === "enviar_arquivo"
                    ) {
                      setSetorDestino("");
                      setOpcoesNode([]);
                    }

                    if (
                      novoTipo !== "enviar_imagem" &&
                      novoTipo !== "enviar_video" &&
                      novoTipo !== "enviar_audio" &&
                      novoTipo !== "enviar_arquivo"
                    ) {
                      setMidiaUrlNode("");
                    }

                    if (novoTipo === "agendar_disparo") {
                      setMensagemNode("");
                      setSetorDestino("");
                      setOpcoesNode([]);
                      setBotoesNode([]);
                      setMidiaUrlNode("");
                    }

                    if (novoTipo.startsWith("agenda_")) {
                      setSetorDestino("");
                      setOpcoesNode([]);
                      setBotoesNode([]);
                      setMidiaUrlNode("");
                      setAgendaUsarContextoNode(false);

                      if (novoTipo === "agenda_buscar_agendamento") {
                        setAgendaListarAgendamentosNode(true);
                        setAgendaQuantidadeOpcoesNode("6");
                        setAgendaMensagemListarAgendamentosNode(
                          "Encontrei estes agendamentos. Responda com o número do agendamento que deseja cancelar ou remarcar:"
                        );
                      }

                      if (novoTipo === "agenda_escolher_horario") {
                        setMensagemNode(
                          "Qual dia voce quer marcar? Pode responder: hoje, amanha, dia 22, 22/05 ou sexta-feira."
                        );
                        setAgendaMensagemListarHorariosNode(
                          "Para {{agenda_data_nova}}, estes horários estão disponíveis.\\n\\nResponda com o número da opção desejada ou informe outra data:"
                        );
                        setAgendaMensagemPreferenciaIndisponivelNode(
                          "O horário {{agenda_preferencia_solicitada}} não está disponível em {{agenda_data_nova}}.\\n\\nEstas são as opções mais próximas:"
                        );
                        setAgendaMensagemDataInvalidaNode(
                          "Essa data não é válida ou já passou. Informe uma data futura.\\n\\nQuando necessário, inclua também o ano."
                        );
                        setAgendaMensagemSemExpedienteNode(
                          "Não há atendimento disponível em {{agenda_data_nova}}.\\n\\nInforme outra data para continuarmos."
                        );
                      }

                      if (novoTipo === "agenda_criar_agendamento") {
                        setMensagemNode(
                          "Agendado! Seu horário ficou marcado para {{agenda_data}} às {{agenda_hora}}. Qualquer dúvida e so entrar em contato."
                        );
                        setAgendaEnviarEmailNode(true);
                        setAgendaEmailOrigemNode("contato");
                        setAgendaEmailVariavelNode("email");
                      }

                      if (novoTipo === "agenda_remarcar_agendamento") {
                        setMensagemNode(
                          "Remarcado! Seu horário agora ficou para {{agenda_data}} às {{agenda_hora}}."
                        );
                      }

                      if (novoTipo === "agenda_cancelar_agendamento") {
                        setMensagemNode(
                          "Pronto, seu horário de {{agenda_data}} às {{agenda_hora}} foi cancelado. Quando quiser marcar novamente, e so me chamar."
                        );
                        setAgendaStatusAgendamentoNode("cancelado");
                        setAgendaEnviarEmailNode(true);
                        setAgendaEmailOrigemNode("contato");
                        setAgendaEmailVariavelNode("email");
                      }
                    }
                  }}
                  onTituloChange={setTituloNode}
                  onMensagemChange={setMensagemNode}
                  onGerenciarVariaveis={() => abrirModalGerenciarVariaveis("mensagem")}
                >\n                  `;

          source = source.slice(0, formStart) + panelOpen + source.slice(childrenStart);

          const closeMarker = '\n\n                </div>\n                ) : (\n                  <ConnectionEditor';
          const closeIndex = source.indexOf(closeMarker, source.indexOf('<NodeConfigPanel'));
          if (closeIndex < 0) throw new Error('Fechamento do formulario de bloco nao encontrado');
          source = source.replace(
            closeMarker,
            '\n\n                </NodeConfigPanel>\n                ) : (\n                  <ConnectionEditor'
          );

          if (!source.includes('<NodeConfigPanel')) throw new Error('NodeConfigPanel nao conectado');
          if (source.includes('<div className={styles.propertiesForm}>', nodeBranchIndex)) {
            const firstFormAfterNode = source.indexOf('<div className={styles.propertiesForm}>', nodeBranchIndex);
            const connectionIndex = source.indexOf('<ConnectionEditor', nodeBranchIndex);
            if (firstFormAfterNode >= 0 && firstFormAfterNode < connectionIndex) {
              throw new Error('Formulario antigo ainda presente no ramo de node');
            }
          }

          fs.writeFileSync(path, source);
          NODE

      - name: Registrar refatoracao e remover workflow temporario
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refactor-fluxos-node-config-panel.yml
          git add 'src/app/(private)/fluxos/FluxosEditor.tsx'
          git commit -m 'refactor: conectar painel comum de configuracao de bloco'
          git push origin HEAD:refactor/fluxos-editor-estrutura
