name: Aplicar permissao atendimentos bot

on:
  push:
    branches:
      - feat/permissao-visualizar-atendimentos-bot

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/permissao-visualizar-atendimentos-bot
          fetch-depth: 0

      - name: Aplicar alteracoes nativas
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, marker=None):
              p = Path(path)
              text = p.read_text()
              if marker and marker in text:
                  print(f"{path}: ja aplicado")
                  return
              if old not in text:
                  raise SystemExit(f"Padrao nao encontrado em {path}: {old[:120]!r}")
              text = text.replace(old, new, 1)
              p.write_text(text)
              print(f"{path}: atualizado")

          replace_once(
              "src/lib/auth/authorization.ts",
              '''export async function podeVisualizarConversas(usuario: UsuarioAuth) {\n  return await temPermissao(usuario, "conversas.visualizar");\n}\n\n''',
              '''export async function podeVisualizarConversas(usuario: UsuarioAuth) {\n  return await temPermissao(usuario, "conversas.visualizar");\n}\n\nexport async function podeVisualizarAtendimentosBot(usuario: UsuarioAuth) {\n  return await temPermissao(\n    usuario,\n    "conversas.visualizar_atendimentos_bot"\n  );\n}\n\n''',
              'conversas.visualizar_atendimentos_bot'
          )

          replace_once(
              "src/lib/conversas/visibilidade.ts",
              '''  isAdministrador,\n  podeVisualizarConversasDoSetor,\n  podeVisualizarConversasEncerradasDoSetor,\n''',
              '''  isAdministrador,\n  podeVisualizarAtendimentosBot,\n  podeVisualizarConversasDoSetor,\n  podeVisualizarConversasEncerradasDoSetor,\n''',
              'podeVisualizarAtendimentosBot,'
          )
          replace_once(
              "src/lib/conversas/visibilidade.ts",
              '''  responsavel_id: string | null;\n  status?: string | null;\n''',
              '''  responsavel_id: string | null;\n  bot_ativo?: boolean | null;\n  status?: string | null;\n''',
              'bot_ativo?: boolean | null;'
          )
          replace_once(
              "src/lib/conversas/visibilidade.ts",
              '''export async function podeVisualizarConversasEncerradasDoSetorEfetivo(\n  usuario: UsuarioContexto\n) {\n  if (isAdministrador(usuario)) return true;\n\n  return await podeVisualizarConversasEncerradasDoSetor(usuario);\n}\n\n''',
              '''export async function podeVisualizarConversasEncerradasDoSetorEfetivo(\n  usuario: UsuarioContexto\n) {\n  if (isAdministrador(usuario)) return true;\n\n  return await podeVisualizarConversasEncerradasDoSetor(usuario);\n}\n\nexport async function podeVisualizarAtendimentosBotEfetivo(\n  usuario: UsuarioContexto\n) {\n  if (isAdministrador(usuario)) return true;\n\n  return await podeVisualizarAtendimentosBot(usuario);\n}\n\n''',
              'podeVisualizarAtendimentosBotEfetivo'
          )
          replace_once(
              "src/lib/conversas/visibilidade.ts",
              '''  if (isAdministrador(usuario)) return true;\n\n  if (conversa.responsavel_id === usuario.id) return true;\n''',
              '''  if (isAdministrador(usuario)) return true;\n\n  if (\n    conversa.bot_ativo === true &&\n    (await podeVisualizarAtendimentosBotEfetivo(usuario))\n  ) {\n    return true;\n  }\n\n  if (conversa.responsavel_id === usuario.id) return true;\n''',
              'conversa.bot_ativo === true'
          )

          replace_once(
              "src/app/api/conversas/route.ts",
              '''  podeVisualizarConversasAtribuidasDoSetor,\n  podeVisualizarConversasEncerradasDoSetorEfetivo,\n''',
              '''  podeVisualizarAtendimentosBotEfetivo,\n  podeVisualizarConversasAtribuidasDoSetor,\n  podeVisualizarConversasEncerradasDoSetorEfetivo,\n''',
              'podeVisualizarAtendimentosBotEfetivo,'
          )
          replace_once(
              "src/app/api/conversas/route.ts",
              '''    usuarioPodeVisualizarAtribuidasDoSetor,\n    usuarioPodeVisualizarEncerradasDoSetor,\n  ] = await Promise.all([\n    podeVisualizarConversasAtribuidasDoSetor(usuario),\n    podeVisualizarConversasEncerradasDoSetorEfetivo(usuario),\n  ]);\n''',
              '''    usuarioPodeVisualizarAtribuidasDoSetor,\n    usuarioPodeVisualizarEncerradasDoSetor,\n    usuarioPodeVisualizarAtendimentosBot,\n  ] = await Promise.all([\n    podeVisualizarConversasAtribuidasDoSetor(usuario),\n    podeVisualizarConversasEncerradasDoSetorEfetivo(usuario),\n    podeVisualizarAtendimentosBotEfetivo(usuario),\n  ]);\n''',
              'usuarioPodeVisualizarAtendimentosBot,'
          )
          replace_once(
              "src/app/api/conversas/route.ts",
              '''      p_usuario_pode_visualizar_encerradas_setor:\n        usuarioPodeVisualizarEncerradasDoSetor,\n      p_status: status,\n''',
              '''      p_usuario_pode_visualizar_encerradas_setor:\n        usuarioPodeVisualizarEncerradasDoSetor,\n      p_usuario_pode_visualizar_bot: usuarioPodeVisualizarAtendimentosBot,\n      p_status: status,\n''',
              'p_usuario_pode_visualizar_bot: usuarioPodeVisualizarAtendimentosBot'
          )
          replace_once(
              "src/app/api/conversas/route.ts",
              '''          usuarioPodeVisualizarEncerradasSetor:\n            usuarioPodeVisualizarEncerradasDoSetor,\n          filtros: filtrosComuns,\n''',
              '''          usuarioPodeVisualizarEncerradasSetor:\n            usuarioPodeVisualizarEncerradasDoSetor,\n          usuarioPodeVisualizarBot: usuarioPodeVisualizarAtendimentosBot,\n          filtros: filtrosComuns,\n''',
              'usuarioPodeVisualizarBot: usuarioPodeVisualizarAtendimentosBot'
          )

          replace_once(
              "src/lib/conversas/contadores.ts",
              '''  usuarioPodeAtribuir,\n  usuarioPodeVisualizarEncerradasSetor,\n  filtros,\n''',
              '''  usuarioPodeAtribuir,\n  usuarioPodeVisualizarEncerradasSetor,\n  usuarioPodeVisualizarBot,\n  filtros,\n''',
              'usuarioPodeVisualizarBot,'
          )
          replace_once(
              "src/lib/conversas/contadores.ts",
              '''  usuarioPodeAtribuir: boolean;\n  usuarioPodeVisualizarEncerradasSetor: boolean;\n  filtros: FiltrosContadoresConversas;\n''',
              '''  usuarioPodeAtribuir: boolean;\n  usuarioPodeVisualizarEncerradasSetor: boolean;\n  usuarioPodeVisualizarBot: boolean;\n  filtros: FiltrosContadoresConversas;\n''',
              'usuarioPodeVisualizarBot: boolean;'
          )
          replace_once(
              "src/lib/conversas/contadores.ts",
              '''    usuarioPodeAtribuir,\n    usuarioPodeVisualizarEncerradasSetor,\n    setoresIds.join(","),\n''',
              '''    usuarioPodeAtribuir,\n    usuarioPodeVisualizarEncerradasSetor,\n    usuarioPodeVisualizarBot,\n    setoresIds.join(","),\n''',
              'usuarioPodeVisualizarBot,\n    setoresIds.join'
          )
          replace_once(
              "src/lib/conversas/contadores.ts",
              '''        p_usuario_pode_visualizar_encerradas_setor:\n          usuarioPodeVisualizarEncerradasSetor,\n        p_status: filtros.status,\n''',
              '''        p_usuario_pode_visualizar_encerradas_setor:\n          usuarioPodeVisualizarEncerradasSetor,\n        p_usuario_pode_visualizar_bot: usuarioPodeVisualizarBot,\n        p_status: filtros.status,\n''',
              'p_usuario_pode_visualizar_bot: usuarioPodeVisualizarBot'
          )
          replace_once(
              "src/lib/conversas/contadores.ts",
              '''          usuarioPodeAtribuir,\n          usuarioPodeVisualizarEncerradasSetor,\n          status: filtros.status,\n''',
              '''          usuarioPodeAtribuir,\n          usuarioPodeVisualizarEncerradasSetor,\n          usuarioPodeVisualizarBot,\n          status: filtros.status,\n''',
              'usuarioPodeVisualizarBot,\n          status: filtros.status'
          )

          replace_once(
              "src/lib/conversas/nao-lidas.ts",
              '''  usuarioPodeAtribuir: boolean;\n  usuarioPodeVisualizarEncerradasSetor: boolean;\n  status?: string | null;\n''',
              '''  usuarioPodeAtribuir: boolean;\n  usuarioPodeVisualizarEncerradasSetor: boolean;\n  usuarioPodeVisualizarBot: boolean;\n  status?: string | null;\n''',
              'usuarioPodeVisualizarBot: boolean;'
          )
          replace_once(
              "src/lib/conversas/nao-lidas.ts",
              '''      params.usuarioPodeAtribuir,\n      params.usuarioPodeVisualizarEncerradasSetor,\n      params.status,\n''',
              '''      params.usuarioPodeAtribuir,\n      params.usuarioPodeVisualizarEncerradasSetor,\n      params.usuarioPodeVisualizarBot,\n      params.status,\n''',
              'params.usuarioPodeVisualizarBot,\n      params.status'
          )
          replace_once(
              "src/lib/conversas/nao-lidas.ts",
              '''          p_usuario_pode_visualizar_encerradas_setor:\n            params.usuarioPodeVisualizarEncerradasSetor,\n          p_status: params.status || null,\n''',
              '''          p_usuario_pode_visualizar_encerradas_setor:\n            params.usuarioPodeVisualizarEncerradasSetor,\n          p_usuario_pode_visualizar_bot: params.usuarioPodeVisualizarBot,\n          p_status: params.status || null,\n''',
              'p_usuario_pode_visualizar_bot: params.usuarioPodeVisualizarBot'
          )

          replace_once(
              "src/app/api/mensagens/route.ts",
              '''  responsavel_id: string | null;\n  status?: string | null;\n''',
              '''  responsavel_id: string | null;\n  bot_ativo?: boolean | null;\n  status?: string | null;\n''',
              'bot_ativo?: boolean | null;'
          )
          replace_once(
              "src/app/api/mensagens/route.ts",
              '''        "id, empresa_id, setor_id, escopo_fila, responsavel_id, status, origem_atendimento, historico_importado, contato_id, integracao_whatsapp_id"\n''',
              '''        "id, empresa_id, setor_id, escopo_fila, responsavel_id, bot_ativo, status, origem_atendimento, historico_importado, contato_id, integracao_whatsapp_id"\n''',
              'responsavel_id, bot_ativo, status'
          )
          PY

      - name: Validar referencias de visibilidade
        shell: bash
        run: |
          grep -RIn --exclude-dir=.git --exclude-dir=node_modules 'usuarioPodeVisualizarConversa' src || true
          grep -RIn --exclude-dir=.git --exclude-dir=node_modules 'p_usuario_pode_visualizar_bot' src supabase/migrations || true

      - name: Build
        run: npm ci && npm run build

      - name: Commitar alteracoes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteracao pendente."
            exit 0
          fi
          git config user.name "L34n7"
          git config user.email "86571901+L34n7@users.noreply.github.com"
          git add src
          git commit -m "feat: aplicar permissao de visualizacao do bot"
          git push origin HEAD:feat/permissao-visualizar-atendimentos-bot
