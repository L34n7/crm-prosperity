name: Aplicar campos nativos de captura

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar arquivos nativos
        shell: bash
        run: |
          set -euo pipefail
          PATCHER='https://gypbaslogvldndeyjmno.supabase.co/functions/v1/tmp-native-patcher-7f3c91'
          KEY='7f3c91-native'

          curl --fail --silent --show-error "$PATCHER?file=page&k=$KEY" \
            | base64 --decode > 'src/app/(private)/conversas/page.tsx'
          curl --fail --silent --show-error "$PATCHER?file=layout&k=$KEY" \
            | base64 --decode > 'src/app/(private)/conversas/layout.tsx'
          curl --fail --silent --show-error "$PATCHER?file=alignment&k=$KEY" \
            | base64 --decode > 'src/app/(private)/conversas/ConteudoIndisponivelAlignment.tsx'

          rm -rf 'src/app/api/internal/tmp-source-reader-7f3c91'
          rm -rf 'src/app/api/internal/tmp-native-output-7f3c91'
          rm -f 'src/app/(private)/conversas/CaptureInfoPanel.tsx'
          rm -f 'src/app/(private)/conversas/CaptureInfoPanelVisible.tsx'
          rm -f '.github/workflows/native-capture-fields.yml'

      - name: Validar build
        run: |
          npm ci
          npm run build

      - name: Publicar implementação
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Exibir capturas nativamente nos detalhes do contato"
          git push origin HEAD:main
