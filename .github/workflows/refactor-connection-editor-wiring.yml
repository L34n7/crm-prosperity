name: Refactor connection editor wiring

on:
  push:
    branches:
      - refactor/fluxos-editor-estrutura

permissions:
  contents: write

jobs:
  wire-connection-editor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/fluxos-editor-estrutura
          fetch-depth: 0

      - name: Wire extracted connection editor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/app/(private)/fluxos/FluxosEditor.tsx")
          text = path.read_text(encoding="utf-8")

          import_anchor = 'import FluxoCanvas from "./components/FluxoCanvas";\n'
          connection_import = 'import ConnectionEditor from "./components/ConnectionEditor";\n'
          if text.count(import_anchor) != 1:
              raise RuntimeError("FluxoCanvas import anchor not found exactly once")
          if connection_import not in text:
              text = text.replace(import_anchor, connection_import + import_anchor, 1)

          start_marker = '''                ) : (\n                <div className={styles.propertiesForm}>\n                    <label className={styles.field}>\n                      <span className={styles.label}>Nome da conexão</span>\n'''
          end_marker = '''                )}\n            </aside>\n'''

          if text.count(start_marker) != 1:
              raise RuntimeError(f"Expected one connection editor start marker, found {text.count(start_marker)}")

          start = text.index(start_marker)
          end = text.index(end_marker, start)
          old_block = text[start:end]

          for expected in [
              'value={tipoCondicaoConexao}',
              'onClick={gerarDescricaoConexaoComIa}',
              'value={valorCondicao}',
              'onClick={() => aplicarEdicaoConexao()}',
              'onClick={() => removerConexao(edgeEditada.id)}',
          ]:
              if expected not in old_block:
                  raise RuntimeError(f"Unexpected connection editor block; missing {expected}")

          replacement = '''                ) : (\n                  <ConnectionEditor\n                    rotuloConexao={rotuloConexao}\n                    tipoCondicaoConexao={tipoCondicaoConexao}\n                    timeoutQuantidade={timeoutQuantidade}\n                    timeoutUnidade={timeoutUnidade}\n                    statusEnvioTimeout={statusEnvioTimeout}\n                    origemPerguntaLivreIa={edgeEditadaOrigemPerguntaLivreIa}\n                    usarIaConexao={usarIaConexao}\n                    descricaoIaConexao={descricaoIaConexao}\n                    valorCondicao={valorCondicao}\n                    gerandoDescricaoIaConexao={gerandoDescricaoIaConexao}\n                    salvando={salvando}\n                    confirmandoExclusaoConexao={confirmandoExclusaoConexao}\n                    onNomeConexaoChange={(valor) => {\n                      setNomeConexaoEditadoManual(true);\n                      setRotuloConexao(valor);\n                    }}\n                    onTipoCondicaoChange={(novoTipo) => {\n                      setTipoCondicaoConexao(novoTipo);\n\n                      if (novoTipo === "sempre") {\n                        setValorCondicao("");\n                        setRotuloConexao("Sempre seguir");\n                        setUsarIaConexao(false);\n                      }\n\n                      if (novoTipo === "timeout_sem_resposta") {\n                        setUsarIaConexao(false);\n                      }\n                    }}\n                    onTimeoutQuantidadeChange={setTimeoutQuantidade}\n                    onTimeoutUnidadeChange={setTimeoutUnidade}\n                    onStatusEnvioTimeoutChange={setStatusEnvioTimeout}\n                    onUsarIaChange={(ativo) => {\n                      setUsarIaConexao(ativo);\n\n                      if (!ativo) {\n                        setDescricaoIaConexao("");\n                        return;\n                      }\n\n                      setDescricaoIaConexao(\n                        gerarSugestaoDescricaoIaConexao({\n                          edge: edgeEditada,\n                          rotulo: rotuloConexao,\n                          valor: valorCondicao,\n                        })\n                      );\n                    }}\n                    onDescricaoIaChange={setDescricaoIaConexao}\n                    onGerarDescricaoIa={gerarDescricaoConexaoComIa}\n                    onValorCondicaoChange={(novoValor) => {\n                      setValorCondicao(novoValor);\n\n                      if (!nomeConexaoEditadoManual) {\n                        setRotuloConexao(novoValor);\n                      }\n\n                      if (!descricaoIaConexao.trim()) {\n                        setDescricaoIaConexao(\n                          gerarSugestaoDescricaoIaConexao({\n                            edge: edgeEditada,\n                            rotulo: nomeConexaoEditadoManual\n                              ? rotuloConexao\n                              : novoValor,\n                            valor: novoValor,\n                          })\n                        );\n                      }\n                    }}\n                    onPedirExclusao={() =>\n                      setConfirmandoExclusaoConexao(true)\n                    }\n                    onConfirmarExclusao={() => {\n                      if (edgeEditada) {\n                        removerConexao(edgeEditada.id);\n                      }\n                    }}\n                    onCancelar={fecharPainelEdicao}\n                    onAplicar={() => {\n                      void aplicarEdicaoConexao();\n                    }}\n                  />\n'''

          text = text[:start] + replacement + text[end:]

          if 'Nome da conexão' in text:
              raise RuntimeError("Inline connection editor still present in FluxosEditor")
          if '<ConnectionEditor' not in text:
              raise RuntimeError("ConnectionEditor component was not wired")
          if text.count('import ConnectionEditor from "./components/ConnectionEditor";') != 1:
              raise RuntimeError("ConnectionEditor import is invalid")

          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/refactor-connection-editor-wiring.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "refactor: conectar editor de conexoes extraido"
          git push origin HEAD:refactor/fluxos-editor-estrutura
