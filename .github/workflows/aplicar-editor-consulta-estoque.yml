name: Aplicar editor Consultar estoque

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/aplicar-editor-consulta-estoque.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Aplicar alteracoes no editor de fluxos
        shell: bash
        run: |
          git show HEAD^:.github/workflows/aplicar-editor-consulta-estoque.yml > /tmp/estoque-editor-anterior.yml
          awk '
            /python3 <<'\''PY'\''/ { capturar=1; next }
            capturar && /^          PY$/ { exit }
            capturar { sub(/^          /, ""); print }
          ' /tmp/estoque-editor-anterior.yml > /tmp/aplicar-editor.py
          python3 /tmp/aplicar-editor.py

      - name: Validar build
        run: |
          npm ci
          npm run build

      - name: Publicar alteracao validada
        shell: bash
        run: |
          rm .github/workflows/aplicar-editor-consulta-estoque.yml
          git config user.name "L34n7"
          git config user.email "86571901+L34n7@users.noreply.github.com"
          git add 'src/app/(private)/fluxos/page.tsx' .github/workflows/aplicar-editor-consulta-estoque.yml
          git commit -m "feat: adicionar no consultar estoque ao construtor"
          git push origin HEAD:main
