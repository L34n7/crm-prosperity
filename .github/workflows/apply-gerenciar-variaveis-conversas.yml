name: Aplicar gerenciador de variáveis nas conversas

on:
  push:
    branches:
      - feature/gerenciar-variaveis-disparo-individual

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gerenciar-variaveis-disparo-individual
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Aplicar ajuste nativo em React/TypeScript
        run: |
          node <<'NODE'
          const fs = require('fs');

          const pagePath = 'src/app/(private)/conversas/page.tsx';
          const cssPath = 'src/app/(private)/conversas/conversas.module.css';
          let page = fs.readFileSync(pagePath, 'utf8');
          let css = fs.readFileSync(cssPath, 'utf8');

          function replaceOnce(source, from, to, label) {
            const first = source.indexOf(from);
            if (first < 0) throw new Error(`Trecho não encontrado: ${label}`);
            if (source.indexOf(from, first + from.length) >= 0) {
              throw new Error(`Trecho duplicado inesperadamente: ${label}`);
            }
            return source.slice(0, first) + to + source.slice(first + from.length);
          }

          page = replaceOnce(
            page,
            '  const [modalVariavelAberto, setModalVariavelAberto] = useState(false);\n  const [erroVariavelModal, setErroVariavelModal] = useState("");',
            '  const [modalVariavelAberto, setModalVariavelAberto] = useState(false);\n  const [contextoModalVariavel, setContextoModalVariavel] = useState<\n    "macro" | "disparo-individual"\n  >("macro");\n  const [erroVariavelModal, setErroVariavelModal] = useState("");',
            'estado do contexto do modal'
          );

          page = replaceOnce(
            page,
            '  async function abrirModalVariavel() {\n    setMacroCardAberto(false);',
            '  async function abrirModalVariavelNoContexto(\n    contexto: "macro" | "disparo-individual"\n  ) {\n    setContextoModalVariavel(contexto);\n    setMacroCardAberto(false);',
            'abertura contextual do modal'
          );

          page = replaceOnce(
            page,
            '\n  function fecharModalVariavel() {',
            '\n  function abrirModalVariavel() {\n    return abrirModalVariavelNoContexto("macro");\n  }\n\n  function abrirModalVariavelDisparoIndividual() {\n    return abrirModalVariavelNoContexto("disparo-individual");\n  }\n\n  function fecharModalVariavel() {',
            'atalhos de abertura do modal'
          );

          page = replaceOnce(
            page,
            '  function aplicarVariavelNoTextoMacro(chave: string) {\n    const valor = normalizarChaveVariavelMacro(chave);\n\n    if (!valor) return;\n\n    const token = `{{${valor}}}`;',
            '  function aplicarVariavelNoTextoMacro(chave: string) {\n    const valor = normalizarChaveVariavelMacro(chave);\n\n    if (!valor) return;\n\n    if (contextoModalVariavel === "disparo-individual") {\n      const limite = Math.max(1, quantidadeParametrosBody);\n\n      setParametros((atuais) => {\n        const proximo = Array.from(\n          { length: limite },\n          (_, index) => atuais[index] || ""\n        );\n        const primeiroVazio = proximo.findIndex((item) => !item.trim());\n        const indice = primeiroVazio >= 0 ? primeiroVazio : 0;\n        proximo[indice] = valor;\n        return proximo;\n      });\n      return;\n    }\n\n    const token = `{{${valor}}}`;',
            'uso contextual da variável'
          );

          page = replaceOnce(
            page,
            '                                    {quantidadeParametrosBody > 0 && (\n                                      <div className={styles.disparoParams}>\n                                        {Array.from({ length: quantidadeParametrosBody }).map((_, i) => (\n                                          <TemplateVariableSearchSelect\n                                            key={i}\n                                            label={`Variável ${i + 1}`}\n                                            value={parametros[i] || ""}\n                                            onChange={(chave) => atualizarParametro(i, chave)}\n                                            opcoes={opcoesVariaveisDisparoIndividual}\n                                            carregando={carregandoVariaveis}\n                                          />\n                                        ))}\n                                      </div>\n                                    )}',
            '                                    {quantidadeParametrosBody > 0 && (\n                                      <>\n                                        <div className={styles.disparoParams}>\n                                          {Array.from({ length: quantidadeParametrosBody }).map((_, i) => (\n                                            <TemplateVariableSearchSelect\n                                              key={i}\n                                              label={`Variável ${i + 1}`}\n                                              value={parametros[i] || ""}\n                                              onChange={(chave) => atualizarParametro(i, chave)}\n                                              opcoes={opcoesVariaveisDisparoIndividual}\n                                              carregando={carregandoVariaveis}\n                                            />\n                                          ))}\n                                        </div>\n\n                                        <div className={styles.disparoManageVariablesRow}>\n                                          <button\n                                            type="button"\n                                            className={styles.disparoManageVariablesButton}\n                                            onClick={abrirModalVariavelDisparoIndividual}\n                                          >\n                                            <Variable size={14} />\n                                            Gerenciar variáveis\n                                          </button>\n                                        </div>\n                                      </>\n                                    )}',
            'botão abaixo das variáveis do disparo individual'
          );

          page = replaceOnce(
            page,
            '          <div\n            className={`${styles.modalConfirmacao} ${styles.variableModalCard}`}\n            onClick={(e) => e.stopPropagation()}\n          >',
            '          <div\n            className={`${styles.modalConfirmacao} ${styles.variableModalCard}`}\n            role="dialog"\n            aria-modal="true"\n            aria-labelledby="gerenciar-variaveis-titulo"\n            onClick={(e) => e.stopPropagation()}\n          >',
            'acessibilidade do modal de variáveis'
          );

          page = replaceOnce(
            page,
            '                <h3 className={styles.modalTitle}>Gerenciar variáveis</h3>\n                <p className={styles.modalSubtitle}>\n                  Cadastre variáveis personalizadas e consulte as variáveis fixas disponíveis para macros, disparos e fluxos.\n                </p>',
            '                <h3 id="gerenciar-variaveis-titulo" className={styles.modalTitle}>\n                  Gerenciar variáveis\n                </h3>\n                <p className={styles.modalSubtitle}>\n                  {contextoModalVariavel === "disparo-individual"\n                    ? "Cadastre variáveis personalizadas e consulte as variáveis fixas disponíveis para disparos e fluxos."\n                    : "Cadastre variáveis personalizadas e consulte as variáveis fixas disponíveis para macros, disparos e fluxos."}\n                </p>',
            'texto contextual do modal'
          );

          const cssBlock = `\n\n/* CRM_INDIVIDUAL_DISPATCH_VARIABLE_MANAGER_V1 */\n.disparoManageVariablesRow {\n  display: flex;\n  justify-content: flex-start;\n  margin-top: 10px;\n}\n\n.disparoManageVariablesButton {\n  flex-shrink: 0;\n  min-height: 42px;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 7px;\n  border: 1px solid var(--crm-border);\n  background: var(--crm-surface);\n  color: var(--crm-text-strong);\n  border-radius: 14px;\n  padding: 0 16px;\n  font-size: 13px;\n  font-weight: 800;\n  cursor: pointer;\n  white-space: nowrap;\n  transition: all 0.2s ease;\n}\n\n.disparoManageVariablesButton:hover {\n  border-color: var(--crm-primary-border);\n  background: var(--crm-surface-subtle);\n  transform: translateY(-1px);\n}\n\n@media (max-width: 768px) {\n  .disparoManageVariablesRow,\n  .disparoManageVariablesButton {\n    width: 100%;\n  }\n}\n`;

          if (!css.includes('CRM_INDIVIDUAL_DISPATCH_VARIABLE_MANAGER_V1')) {
            css += cssBlock;
          }

          fs.writeFileSync(pagePath, page);
          fs.writeFileSync(cssPath, css);
          NODE

      - name: Validar diff
        run: |
          git diff --check
          grep -q 'abrirModalVariavelDisparoIndividual' 'src/app/(private)/conversas/page.tsx'
          grep -q 'CRM_INDIVIDUAL_DISPATCH_VARIABLE_MANAGER_V1' 'src/app/(private)/conversas/conversas.module.css'

      - name: Validar TypeScript sem aceitar novos erros
        run: |
          set +e
          npx tsc --noEmit > /tmp/tsc.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cat /tmp/tsc.log
            filtered=$(grep -v -E 'tests/assistente-fluxos-(planejamento|resiliencia)\.test\.mts.*Property .midias. is missing' /tmp/tsc.log | grep -E 'error TS' || true)
            if [ -n "$filtered" ]; then
              echo "Foram encontrados novos erros TypeScript:"
              echo "$filtered"
              exit 1
            fi
            echo "Somente os erros TypeScript de baseline já conhecidos permaneceram."
          fi

      - name: Commitar implementação e remover workflow temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-gerenciar-variaveis-conversas.yml
          git add 'src/app/(private)/conversas/page.tsx' 'src/app/(private)/conversas/conversas.module.css'
          git commit -m "feat: gerenciar variáveis no disparo individual"
          git push origin HEAD:feature/gerenciar-variaveis-disparo-individual
