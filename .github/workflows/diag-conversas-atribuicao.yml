name: Diagnosticar atribuicao conversas

on:
  push:
    branches:
      - fix/conversas-atribuir-fluxo-unico

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Procurar implementacoes e textos
        shell: bash
        run: |
          echo '=== Frases do print ==='
          grep -RIn --exclude-dir=.git --exclude-dir=node_modules -E 'Setor dos usuários|Setor dos usuarios|Administradores aparecem em todos os setores|Escolha o setor para listar seus usuários|Escolha o setor para listar seus usuarios' . || true
          echo '=== Endpoint opcoes-atribuicao ==='
          grep -RIn --exclude-dir=.git --exclude-dir=node_modules 'opcoes-atribuicao' . || true
          echo '=== usuariosFiltradosPorSetor ==='
          grep -RIn --exclude-dir=.git --exclude-dir=node_modules 'usuariosFiltradosPorSetor' . || true
          echo '=== acao atribuir ==='
          grep -RIn --exclude-dir=.git --exclude-dir=node_modules 'acaoAberta === "atribuir"' . || true
