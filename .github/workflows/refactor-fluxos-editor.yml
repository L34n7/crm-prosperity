name: Refactor fluxos editor wiring

on:
  push:
    branches:
      - refactor/fluxos-editor-estrutura

permissions:
  contents: write

jobs:
  wiring:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/fluxos-editor-estrutura
          fetch-depth: 0

      - name: Wire extracted flow components
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/app/(private)/fluxos/FluxosEditor.tsx")
          text = path.read_text(encoding="utf-8")

          def replace_between(source: str, start_marker: str, end_marker: str, replacement: str) -> str:
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              return source[:start] + replacement + source[end:]

          import_anchor = 'import styles from "./fluxos.module.css";\n'
          extracted_imports = '''import FluxoCanvas from "./components/FluxoCanvas";\nimport FluxoEditorHeader from "./components/FluxoEditorHeader";\nimport WhatsappFlowPreview from "./components/WhatsappFlowPreview";\nimport {\n  montarPreviaWhatsappFluxo,\n  type EncerramentoInatividadePreviaWhatsapp,\n} from "./whatsapp-preview";\n'''

          if extracted_imports not in text:
              if import_anchor not in text:
                  raise RuntimeError("Import anchor not found")
              text = text.replace(import_anchor, import_anchor + extracted_imports, 1)

          text = text.replace('import { Handle } from "@xyflow/react";\n', '', 1)
          for unused_line in [
              '  Background,\n',
              '  Controls,\n',
              '  MiniMap,\n',
              '  ReactFlow,\n',
              '  ChevronLeft,\n',
              '  ChevronRight,\n',
              '  MessageCircle,\n',
          ]:
              text = text.replace(unused_line, '', 1)

          node_types_block = '''const nodeTypes = {\n  custom: NodeCustom,\n};\n\n'''
          if node_types_block not in text:
              raise RuntimeError("nodeTypes block not found")
          text = text.replace(node_types_block, '', 1)

          text = replace_between(
              text,
              'function corTipoNo(tipo: string) {',
              'function tituloPadraoTipoNo(tipo: string) {',
              ''
          )

          text = replace_between(
              text,
              'function NodeCustom({ data, dragging }: any) {',
              'type TipoMensagemPreviaWhatsapp =',
              ''
          )

          text = replace_between(
              text,
              'type TipoMensagemPreviaWhatsapp =',
              'function configuracaoMarcada(valor: unknown) {',
              ''
          )

          header = '''        <FluxoEditorHeader\n          fluxoSelecionado={fluxoSelecionado}\n          fluxoSistema={fluxoEhSistemaCalendario(fluxoSelecionado)}\n          salvando={salvando}\n          ultimoSalvamentoTexto={formatarUltimoSalvamento(ultimoSalvamento)}\n          podeCriarFluxos={podeCriarFluxos}\n          podeEditarFluxos={podeEditarFluxos}\n          podeAtivarFluxos={podeAtivarFluxos}\n          podeArquivarFluxos={podeArquivarFluxos}\n          podeExcluirFluxos={podeExcluirFluxos}\n          onAbrirAssistente={() => setAssistenteFluxosAberto(true)}\n          onAdicionarNo={adicionarNo}\n          onEditarFluxo={() => abrirEdicaoFluxo()}\n          onSalvarEstrutura={() => {\n            void salvarEstrutura();\n          }}\n          onAlterarStatus={(fluxoAlvo, status) => {\n            void alterarStatusFluxo(fluxoAlvo, status);\n          }}\n          onRestaurarFluxo={(fluxoAlvo) => {\n            void restaurarFluxo(fluxoAlvo);\n          }}\n          onApagarDefinitivo={abrirModalApagarDefinitivo}\n          onDuplicarFluxo={(fluxoAlvo) => {\n            void duplicarFluxo(fluxoAlvo);\n          }}\n          onCompartilharFluxo={abrirCompartilhamentoFluxo}\n          onArquivarFluxo={abrirModalArquivarFluxo}\n        />\n\n'''
          text = replace_between(
              text,
              '        <header className={styles.editorHeader}>',
              '          {fluxoSelecionado?.status === "arquivado" && (',
              header
          )

          canvas = '''          <FluxoCanvas\n            nodes={nodesRenderizados}\n            edges={edges}\n            carregandoEstrutura={carregandoEstrutura}\n            podeEditarFluxos={podeEditarFluxos}\n            onNodesChange={onNodesChange}\n            onEdgesChange={onEdgesChange}\n            onConnect={onConnect}\n            onEditarNode={abrirEdicaoNo}\n            onEditarEdge={(edge) => {\n              abrirEdicaoConexao(edge);\n\n              setEdges((atuais) =>\n                atuais.map((item) => ({\n                  ...item,\n                  selected: item.id === edge.id,\n                  style: {\n                    ...(item.style || {}),\n                    stroke:\n                      item.id === edge.id\n                        ? "var(--crm-ui-private-border-hex-0098bab6)"\n                        : "var(--crm-ui-private-border-hex-cbd5e1)",\n                    strokeWidth: item.id === edge.id ? 3 : 2,\n                    strokeDasharray: "6 6",\n                  },\n                }))\n              );\n            }}\n          />\n\n'''
          text = replace_between(
              text,
              '          <div className={styles.canvasArea}>',
              '          {fluxoSelecionado && !previaWhatsappRecolhida && (',
              canvas
          )

          preview = '''          {fluxoSelecionado && (\n            <WhatsappFlowPreview\n              fluxoNome={fluxoSelecionado.nome}\n              previa={previaWhatsappFluxo}\n              recolhida={previaWhatsappRecolhida}\n              onRecolher={() => setPreviaWhatsappRecolhida(true)}\n              onExpandir={() => setPreviaWhatsappRecolhida(false)}\n              onSelecionarResposta={(sourceNodeId, edgeId) =>\n                setRespostasPreviaWhatsapp((atuais) => ({\n                  ...atuais,\n                  [sourceNodeId]: edgeId,\n                }))\n              }\n            />\n          )}\n\n\n'''
          text = replace_between(
              text,
              '          {fluxoSelecionado && !previaWhatsappRecolhida && (',
              '          {(nodeEditado || edgeEditada) && (',
              preview
          )

          required_absent = [
              'function NodeCustom({ data, dragging }: any)',
              'type TipoMensagemPreviaWhatsapp =',
              '<ReactFlow',
              'className={styles.whatsappFlowPreviewPanel}',
              '<header className={styles.editorHeader}>',
          ]
          for marker in required_absent:
              if marker in text:
                  raise RuntimeError(f"Marker should have been removed: {marker}")

          required_present = [
              '<FluxoCanvas',
              '<FluxoEditorHeader',
              '<WhatsappFlowPreview',
              'montarPreviaWhatsappFluxo(',
          ]
          for marker in required_present:
              if marker not in text:
                  raise RuntimeError(f"Expected marker missing: {marker}")

          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/refactor-fluxos-editor.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "refactor: conectar editor aos componentes extraidos"
          git push origin HEAD:refactor/fluxos-editor-estrutura
