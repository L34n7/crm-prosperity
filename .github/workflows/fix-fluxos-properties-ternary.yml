name: Corrigir fechamento do painel de propriedades

on:
  push:
    branches:
      - refactor/fluxos-editor-estrutura
    paths:
      - .github/workflows/fix-fluxos-properties-ternary.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/fluxos-editor-estrutura
          fetch-depth: 0

      - name: Corrigir ternario do PropertiesPanel
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/app/(private)/fluxos/FluxosEditor.tsx';
          let source = fs.readFileSync(path, 'utf8');
          const antigo = '                  />\n                ) : null}\n          </PropertiesPanel>';
          const novo = '                  />\n                )}\n          </PropertiesPanel>';
          if (!source.includes(antigo)) throw new Error('Fechamento invalido nao encontrado');
          source = source.replace(antigo, novo);
          if (source.includes(') : null}\n          </PropertiesPanel>')) {
            throw new Error('Fechamento invalido ainda presente');
          }
          fs.writeFileSync(path, source);
          NODE

      - name: Registrar correcao e remover workflow temporario
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-fluxos-properties-ternary.yml
          git add 'src/app/(private)/fluxos/FluxosEditor.tsx'
          git commit -m 'fix: corrigir fechamento do painel de propriedades'
          git push origin HEAD:refactor/fluxos-editor-estrutura
