name: Aplicar ajuste visual do disparo individual

on:
  push:
    branches:
      - fix/disparo-individual-scroll-variaveis

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/disparo-individual-scroll-variaveis
          fetch-depth: 0

      - name: Aplicar ajuste de densidade e rolagem
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cssPath = 'src/app/(private)/conversas/conversas.module.css';
          let css = fs.readFileSync(cssPath, 'utf8');

          const marker = 'CRM_INDIVIDUAL_DISPATCH_SCROLL_DENSITY_V2';
          if (css.includes(marker)) {
            throw new Error('Ajuste já aplicado anteriormente.');
          }

          css += `\n\n/* ${marker} */\n.disparoManageVariablesRow {\n  margin-top: 4px;\n}\n\n.disparoManageVariablesButton {\n  min-height: 30px;\n  gap: 5px;\n  border: 0;\n  background: transparent;\n  color: var(--crm-text-muted);\n  border-radius: 9px;\n  padding: 4px 6px;\n  font-size: 12px;\n  font-weight: 700;\n}\n\n.disparoManageVariablesButton:hover {\n  border-color: transparent;\n  background: var(--crm-surface-soft);\n  color: var(--crm-text-strong);\n  transform: none;\n}\n\n.disparoCardExpandido {\n  max-height: min(620px, calc(100dvh - 260px));\n  overflow-y: auto;\n  overflow-x: hidden;\n  overscroll-behavior: contain;\n  scrollbar-gutter: stable;\n  padding-right: 5px;\n}\n\n.disparoCardExpandido {\n  scrollbar-width: thin;\n  scrollbar-color: var(--crm-border-strong) transparent;\n}\n\n.disparoCardExpandido::-webkit-scrollbar {\n  width: 7px;\n}\n\n.disparoCardExpandido::-webkit-scrollbar-track {\n  background: transparent;\n}\n\n.disparoCardExpandido::-webkit-scrollbar-thumb {\n  background: var(--crm-border-strong);\n  border-radius: 999px;\n}\n\n@media (max-width: 768px) {\n  .disparoManageVariablesRow {\n    width: auto;\n  }\n\n  .disparoManageVariablesButton {\n    width: auto;\n  }\n\n  .disparoCardExpandido {\n    max-height: calc(100dvh - 220px);\n    padding-right: 3px;\n  }\n}\n`;

          fs.writeFileSync(cssPath, css);
          NODE

      - name: Validar ajuste
        run: |
          git diff --check
          grep -q 'CRM_INDIVIDUAL_DISPATCH_SCROLL_DENSITY_V2' 'src/app/(private)/conversas/conversas.module.css'
          grep -q 'max-height: min(620px, calc(100dvh - 260px));' 'src/app/(private)/conversas/conversas.module.css'
          grep -q 'min-height: 30px;' 'src/app/(private)/conversas/conversas.module.css'

      - name: Commitar implementação e remover workflow temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-disparo-individual-scroll.yml
          git add 'src/app/(private)/conversas/conversas.module.css'
          git commit -m "fix: compactar variáveis e adicionar scroll no disparo individual"
          git push origin HEAD:fix/disparo-individual-scroll-variaveis
