name: Integrar MidiaConfig dos fluxos

on:
  push:
    branches:
      - refactor/fluxos-editor-estrutura
    paths:
      - .github/workflows/refactor-fluxos-midia-config.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/fluxos-editor-estrutura
          fetch-depth: 0

      - name: Conectar MidiaConfig
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/app/(private)/fluxos/FluxosEditor.tsx';
          let source = fs.readFileSync(path, 'utf8');

          const importNeedle = 'import NodeConfigPanel from "./components/node-config/NodeConfigPanel";';
          const importLine = 'import MidiaConfig from "./components/node-config/MidiaConfig";';
          if (!source.includes(importLine)) {
            if (!source.includes(importNeedle)) throw new Error('NodeConfigPanel nao encontrado');
            source = source.replace(importNeedle, `${importNeedle}\n${importLine}`);
          }

          const panelIndex = source.indexOf('<NodeConfigPanel');
          const mediaCondition = source.indexOf('[\n                    "enviar_imagem",', panelIndex);
          const start = source.lastIndexOf('{', mediaCondition);
          const nextCondition = source.indexOf('tipoNodeEdicao === "pergunta_opcoes" && (', mediaCondition);
          const end = source.lastIndexOf('{', nextCondition);
          if (panelIndex < 0 || mediaCondition < 0 || start < 0 || nextCondition < 0 || end < 0) {
            throw new Error('Bloco de midia nao encontrado');
          }

          const replacement = `{[
                    "enviar_imagem",
                    "enviar_video",
                    "enviar_audio",
                    "enviar_arquivo",
                  ].includes(tipoNodeEdicao) && (
                    <MidiaConfig
                      tipoNode={tipoNodeEdicao}
                      midiaUrl={midiaUrlNode}
                      midiaNome={midiaNomeNode}
                      midias={midias}
                      carregando={carregandoMidias}
                      enviando={enviandoMidia}
                      podeGerenciar={podeGerenciarMidias}
                      limiteStorageAtingido={limiteStorageMidiasAtingido}
                      storageUsadoBytes={resumoMidias.tamanhoTotal}
                      storageClassName={classeUsoStorageMidias(
                        resumoMidias.tamanhoTotal,
                        LIMITE_STORAGE_MIDIAS_EMPRESA_BYTES
                      )}
                      onSelecionar={(url, nome) => {
                        setMidiaUrlNode(url);
                        setMidiaNomeNode(nome);
                      }}
                      onRemover={() => {
                        setMidiaUrlNode("");
                        setMidiaNomeNode("");
                      }}
                      onArquivoSelecionado={(arquivo) => {
                        setErro("");
                        setSucesso("");

                        if (arquivo.type.startsWith("image/")) {
                          if (arquivo.size > LIMITE_IMAGEM_BYTES) {
                            setErro("A imagem deve ter no máximo 5MB.");
                            return;
                          }
                        }

                        if (tipoNodeEdicao === "enviar_video") {
                          const nomeMinusculo = arquivo.name.toLowerCase();
                          const ehMp4 =
                            arquivo.type === "video/mp4" ||
                            nomeMinusculo.endsWith(".mp4");

                          if (!ehMp4) {
                            setErro(
                              "Formato de vídeo não permitido. Envie somente um arquivo MP4 com vídeo H.264/AVC e áudio AAC."
                            );
                            return;
                          }

                          if (arquivo.size > LIMITE_VIDEO_BYTES) {
                            setErro(
                              "O vídeo deve ter no máximo 16MB. Reduza o tamanho antes de enviar."
                            );
                            return;
                          }
                        }

                        if (arquivo.type.startsWith("audio/")) {
                          if (arquivo.size > LIMITE_AUDIO_BYTES) {
                            setErro(
                              "O áudio deve ter no máximo 16MB. Reduza o tamanho antes de enviar."
                            );
                            return;
                          }
                        }

                        if (
                          tipoNodeEdicao === "enviar_arquivo" &&
                          arquivo.size > LIMITE_ARQUIVO_BYTES
                        ) {
                          setErro("O arquivo deve ter no máximo 50MB.");
                          return;
                        }

                        void enviarNovaMidia(arquivo);
                      }}
                      onAbrirGerenciador={(tipo) => {
                        setAbaMidias(tipo);
                        setModalMidiasAberto(true);
                      }}
                    />
                  )}

                  `;

          source = source.slice(0, start) + replacement + source.slice(end);

          if (!source.includes('<MidiaConfig')) throw new Error('MidiaConfig nao conectado');
          if (source.includes('className={`${styles.optionsBox} ${', source.indexOf('<NodeConfigPanel'))) {
            const oldMedia = source.indexOf('styles.mediaOptionsBoxImagem', source.indexOf('<NodeConfigPanel'));
            const midiaConfig = source.indexOf('<MidiaConfig', source.indexOf('<NodeConfigPanel'));
            const pergunta = source.indexOf('<PerguntaOpcoesConfig', source.indexOf('<NodeConfigPanel'));
            if (oldMedia > midiaConfig && oldMedia < pergunta) throw new Error('Bloco de midia antigo ainda presente');
          }

          fs.writeFileSync(path, source);
          NODE

      - name: Registrar refatoracao e remover workflow temporario
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refactor-fluxos-midia-config.yml
          git add 'src/app/(private)/fluxos/FluxosEditor.tsx'
          git commit -m 'refactor: conectar configuracao visual de midia'
          git push origin HEAD:refactor/fluxos-editor-estrutura
