name: Run capture patch v5

on:
  push:
    branches:
      - feature/variaveis-nome-captura-disparos

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/variaveis-nome-captura-disparos
          fetch-depth: 0

      - name: Apply source patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected 1 occurrence, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Shared resolver for the latest confirmed name captured during a flow.
          path = "src/lib/automacoes/variaveis-fixas-contato.ts"
          anchor = '''export function chaveEhVariavelNomeWhatsapp(chave: unknown) {
            return VARIAVEIS_NOME_WHATSAPP.has(normalizarChaveVariavelFluxo(chave));
          }
          '''
          addition = '''export function chaveEhVariavelNomeWhatsapp(chave: unknown) {
            return VARIAVEIS_NOME_WHATSAPP.has(normalizarChaveVariavelFluxo(chave));
          }

          const VARIAVEIS_NOME_CAPTURA = new Set([
            "nome_captura",
            "primeiro_nome_captura",
          ]);

          export function chaveEhVariavelNomeCaptura(chave: unknown) {
            return VARIAVEIS_NOME_CAPTURA.has(normalizarChaveVariavelFluxo(chave));
          }

          export async function resolverNomeCapturaContato(params: {
            empresaId: string;
            contatoId?: string | null;
            nomeWhatsapp?: string | null;
            nomeFallback?: string | null;
          }) {
            const fallback = String(
              params.nomeWhatsapp || params.nomeFallback || ""
            ).trim();
            const primeiroFallback = fallback.split(/\\s+/).filter(Boolean)[0] || fallback;
            const contatoId = String(params.contatoId || "").trim();
            const empresaId = String(params.empresaId || "").trim();

            if (!contatoId || !empresaId) {
              return {
                nome_captura: fallback,
                primeiro_nome_captura: primeiroFallback,
              };
            }

            const { data, error } = await supabaseAdmin
              .from("contato_informacoes_captura")
              .select("valor")
              .eq("empresa_id", empresaId)
              .eq("contato_id", contatoId)
              .eq("tipo", "nome")
              .eq("ativo", true)
              .order("capturado_em", { ascending: false })
              .limit(1)
              .maybeSingle();

            if (error) {
              console.warn("[VARIAVEIS] Nome capturado indisponivel:", error.message);
              return {
                nome_captura: fallback,
                primeiro_nome_captura: primeiroFallback,
              };
            }

            const nomeCaptura = String(data?.valor || "").trim() || fallback;
            return {
              nome_captura: nomeCaptura,
              primeiro_nome_captura:
                nomeCaptura.split(/\\s+/).filter(Boolean)[0] || nomeCaptura,
            };
          }
          '''
          patch(path, anchor, addition)

          # Scheduled automation dispatch resolves capture variables before validation/queueing.
          path = "src/lib/whatsapp/disparo-agendado-variaveis.ts"
          patch(
              path,
              '  chaveEhVariavelNomeWhatsapp,\n',
              '  chaveEhVariavelNomeWhatsapp,\n  resolverNomeCapturaContato,\n'
          )
          old = '''  const precisaNomeWhatsapp = chaves.some(chaveEhVariavelNomeWhatsapp);
            const nomeWhatsapp = precisaNomeWhatsapp
          '''
          new = '''  const precisaNomeCaptura = chaves.some(
              (chave) => chave === "nome_captura" || chave === "primeiro_nome_captura"
            );
            const precisaNomeWhatsapp =
              precisaNomeCaptura || chaves.some(chaveEhVariavelNomeWhatsapp);
            const nomeWhatsapp = precisaNomeWhatsapp
          '''
          patch(path, old, new)
          old = '''  const fixasContato = await montarMapaVariaveisFixasContato(params.contato, {
            nome_whatsapp: nomeWhatsapp,
            protocolo_atual: protocoloAtual,
            ultimo_protocolo: ultimoProtocolo,
          });
            const mapaPayload = new Map<string, string>();
          '''
          new = '''  const fixasContato = await montarMapaVariaveisFixasContato(params.contato, {
            nome_whatsapp: nomeWhatsapp,
            protocolo_atual: protocoloAtual,
            ultimo_protocolo: ultimoProtocolo,
          });
            const nomesCaptura = precisaNomeCaptura
              ? await resolverNomeCapturaContato({
                  empresaId: params.empresaId,
                  contatoId: params.contato.id || null,
                  nomeWhatsapp,
                  nomeFallback: params.contato.nome || null,
                })
              : null;
            const mapaPayload = new Map<string, string>();
          '''
          patch(path, old, new)
          old = '''  return chaves.map((chave) => {
            if (chaveEhVariavelFixaContato(chave)) {
          '''
          new = '''  return chaves.map((chave) => {
            if (chave === "nome_captura" || chave === "primeiro_nome_captura") {
              return nomesCaptura?.[chave] || "";
            }

            if (chaveEhVariavelFixaContato(chave)) {
          '''
          patch(path, old, new)

          # Bulk/queued dispatch resolves preserved capture markers for each actual contact.
          path = "src/lib/whatsapp/send-template-disparo.ts"
          patch(
              path,
              'import { getSupabaseAdmin } from "@/lib/supabase/admin";\n',
              'import { getSupabaseAdmin } from "@/lib/supabase/admin";\nimport { resolverNomeCapturaContato } from "@/lib/automacoes/variaveis-fixas-contato";\n'
          )
          anchor = '''function texto(valor: unknown) {
            return String(valor || "").trim();
          }
          '''
          addition = '''function texto(valor: unknown) {
            return String(valor || "").trim();
          }

          function extrairChaveNomeCaptura(valor: unknown) {
            const match = String(valor || "")
              .trim()
              .match(/^\\{\\{\\s*(nome_captura|primeiro_nome_captura)\\s*\\}\\}$/);
            return match?.[1] || "";
          }
          '''
          patch(path, anchor, addition)
          patch(
              path,
              '''  const mensagemTemplate =
                montarConteudoTextoTemplateDisparo(payloadTemplate, variaveis) ||
                `Template enviado: ${template.nome}`;
          ''',
              '''  let mensagemTemplate =
                montarConteudoTextoTemplateDisparo(payloadTemplate, variaveis) ||
                `Template enviado: ${template.nome}`;
          '''
          )
          anchor = '''  const nomeContatoFinal =
            recursos.contato?.nome || nomeContato || "Sem nome";
          '''
          addition = '''  const nomeContatoFinal =
            recursos.contato?.nome || nomeContato || "Sem nome";

            if (variaveis.some((valor) => extrairChaveNomeCaptura(valor))) {
              const nomesCaptura = await resolverNomeCapturaContato({
                empresaId,
                contatoId: recursos.contato.id,
                nomeFallback: nomeContatoFinal,
              });

              variaveis = variaveis.map((valor) => {
                const chave = extrairChaveNomeCaptura(valor);
                return chave
                  ? nomesCaptura[chave as "nome_captura" | "primeiro_nome_captura"] || ""
                  : valor;
              });

              mensagemTemplate =
                montarConteudoTextoTemplateDisparo(payloadTemplate, variaveis) ||
                `Template enviado: ${template.nome}`;
            }
          '''
          patch(path, anchor, addition)

          # Individual dispatch resolves the same markers server-side.
          path = "src/app/api/whatsapp/disparo-individual/route.ts"
          patch(
              path,
              'import { getSupabaseAdmin } from "@/lib/supabase/admin";\n',
              'import { getSupabaseAdmin } from "@/lib/supabase/admin";\nimport { resolverNomeCapturaContato } from "@/lib/automacoes/variaveis-fixas-contato";\n'
          )
          anchor = '''function limparNumero(numero: string) {
            return String(numero || "").replace(/\\D/g, "");
          }
          '''
          addition = '''function limparNumero(numero: string) {
            return String(numero || "").replace(/\\D/g, "");
          }

          function extrairChaveNomeCaptura(valor: unknown) {
            const match = String(valor || "")
              .trim()
              .match(/^\\{\\{\\s*(nome_captura|primeiro_nome_captura)\\s*\\}\\}$/);
            return match?.[1] || "";
          }
          '''
          patch(path, anchor, addition)
          patch(
              path,
              '    const bodyParams = Array.isArray(body?.body_params)\n',
              '    let bodyParams = Array.isArray(body?.body_params)\n'
          )
          anchor = '''    const integracaoWhatsappId = conversa.integracao_whatsapp_id;
          '''
          addition = '''    const integracaoWhatsappId = conversa.integracao_whatsapp_id;

            if (bodyParams.some((valor) => extrairChaveNomeCaptura(valor))) {
              const nomesCaptura = await resolverNomeCapturaContato({
                empresaId: usuario.empresa_id,
                contatoId: contato?.id || null,
                nomeFallback: contato?.nome || null,
              });

              bodyParams = bodyParams.map((valor) => {
                const chave = extrairChaveNomeCaptura(valor);
                return chave
                  ? nomesCaptura[chave as "nome_captura" | "primeiro_nome_captura"] || ""
                  : valor;
              });
            }
          '''
          patch(path, anchor, addition)

          # Bulk dispatch UI: make both variables selectable and preserve them until per-contact sending.
          path = "src/app/(private)/disparos-whatsapp/page.tsx"
          anchor = '''  {
            chave: "nome_whatsapp",
            exemplo: "{{nome_whatsapp}}",
            descricao:
              "Nome do perfil do WhatsApp quando existir; se não existir, usa o nome salvo no contato.",
          },
          '''
          addition = anchor + '''  {
            chave: "nome_captura",
            exemplo: "{{nome_captura}}",
            descricao:
              "Último nome confirmado e capturado durante o atendimento/agendamento; se não existir, usa o nome do contato.",
          },
            {
            chave: "primeiro_nome_captura",
            exemplo: "{{primeiro_nome_captura}}",
            descricao:
              "Primeiro nome derivado do último nome confirmado e capturado durante o atendimento/agendamento.",
          },
          '''
          patch(path, anchor, addition)
          old = '''            ? variaveisObrigatorias.map((variavel) =>
                          resolverVariavelContato(
                            variavel,
                            contato,
                            variaveisPersonalizadas,
                            protocolosPorContato
                          )
                        )
                      : [],'''
          new = '''            ? variaveisObrigatorias.map((variavel) =>
                          variavel === "nome_captura" ||
                          variavel === "primeiro_nome_captura"
                            ? `{{${variavel}}}`
                            : resolverVariavelContato(
                                variavel,
                                contato,
                                variaveisPersonalizadas,
                                protocolosPorContato
                              )
                        )
                      : [],'''
          patch(path, old, new)

          # Conversations UI: expose capture vars only for individual dispatch and preserve markers to the API.
          path = "src/app/(private)/conversas/page.tsx"
          old = '    for (const variavel of VARIAVEIS_FIXAS_SISTEMA) {\n'
          new = '''    const variaveisFixasDisparoIndividual = [
              ...VARIAVEIS_FIXAS_SISTEMA,
              {
                chave: "nome_captura",
                exemplo: "{{nome_captura}}",
                descricao:
                  "Último nome confirmado e capturado durante o atendimento/agendamento; se não existir, usa o nome do contato.",
              },
              {
                chave: "primeiro_nome_captura",
                exemplo: "{{primeiro_nome_captura}}",
                descricao:
                  "Primeiro nome derivado do último nome confirmado e capturado durante o atendimento/agendamento.",
              },
            ];

            for (const variavel of variaveisFixasDisparoIndividual) {
          '''
          patch(path, old, new)
          old = '''    const parametrosResolvidos = parametrosSelecionados.map((chave) =>
              resolverVariaveisMacro(`{{${chave}}}`)
            );'''
          new = '''    const parametrosResolvidos = parametrosSelecionados.map((chave) =>
              chave === "nome_captura" || chave === "primeiro_nome_captura"
                ? `{{${chave}}}`
                : resolverVariaveisMacro(`{{${chave}}}`)
            );'''
          patch(path, old, new)

          print("capture variables source patch applied")
          PY

      - name: Validate source patch
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | grep '^src/' | wc -l)" -eq 6
          grep -q 'resolverNomeCapturaContato' src/lib/automacoes/variaveis-fixas-contato.ts
          grep -q 'contato_informacoes_captura' src/lib/automacoes/variaveis-fixas-contato.ts
          grep -q 'nome_captura' src/lib/whatsapp/disparo-agendado-variaveis.ts
          grep -q 'extrairChaveNomeCaptura' src/lib/whatsapp/send-template-disparo.ts
          grep -q 'extrairChaveNomeCaptura' src/app/api/whatsapp/disparo-individual/route.ts
          grep -q 'chave: "nome_captura"' 'src/app/(private)/disparos-whatsapp/page.tsx'
          grep -q 'variaveisFixasDisparoIndividual' 'src/app/(private)/conversas/page.tsx'

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name 'CRM Prosperity Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/
          git commit -m 'feat: adicionar variaveis de nome capturado aos disparos'
          git push origin HEAD:feature/variaveis-nome-captura-disparos
