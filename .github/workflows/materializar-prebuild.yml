name: Materializar correcoes prebuild

on:
  push:
    branches:
      - tmp/materializar-prebuild-20260902

permissions:
  contents: write

jobs:
  materializar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: tmp/materializar-prebuild-20260902
          fetch-depth: 0

      - name: Materializar correcoes no codigo fonte
        run: node scripts/corrigir-conflitos-disparo-anterior-contador.mjs

      - name: Commitar somente codigo nativo
        run: |
          if git diff --quiet -- src/app/'(private)'/disparos-whatsapp/page.tsx src/app/api/whatsapp/disparos/conflitos/route.ts; then
            echo "Nenhuma alteracao necessaria."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/'(private)'/disparos-whatsapp/page.tsx src/app/api/whatsapp/disparos/conflitos/route.ts
          git commit -m "chore: materializar correcoes de disparos"
          git push origin HEAD:tmp/materializar-prebuild-20260902
