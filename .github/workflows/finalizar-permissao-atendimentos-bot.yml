name: Finalizar permissao atendimentos bot

on:
  push:
    branches:
      - feat/permissao-visualizar-atendimentos-bot

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/permissao-visualizar-atendimentos-bot
          fetch-depth: 0

      - name: Reaplicar alteracoes base
        shell: bash
        run: |
          sed -n "/python <<'PY'/,/^          PY$/p" .github/workflows/aplicar-permissao-atendimentos-bot.yml \
            | sed '1d;$d;s/^          //' \
            | python

      - name: Completar pontos de visibilidade
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, marker=None):
              p = Path(path)
              text = p.read_text()
              if marker and marker in text:
                  print(f"{path}: ja aplicado")
                  return
              if old not in text:
                  raise SystemExit(f"Padrao nao encontrado em {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))
              print(f"{path}: atualizado")

          def replace_all(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count == 0:
                  if new in text:
                      print(f"{path}: ja aplicado")
                      return
                  raise SystemExit(f"Padrao nao encontrado em {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new))
              print(f"{path}: {count} ocorrencia(s) atualizada(s)")

          # Endpoint agregado de não lidas também precisa considerar a nova permissão.
          replace_once(
              "src/app/api/conversas/nao-lidas/route.ts",
              '''import {\n  podeVisualizarConversasAtribuidasDoSetor,\n  podeVisualizarConversasEncerradasDoSetorEfetivo,\n} from "@/lib/conversas/visibilidade";''',
              '''import {\n  podeVisualizarAtendimentosBotEfetivo,\n  podeVisualizarConversasAtribuidasDoSetor,\n  podeVisualizarConversasEncerradasDoSetorEfetivo,\n} from "@/lib/conversas/visibilidade";''',
              'podeVisualizarAtendimentosBotEfetivo,'
          )
          replace_once(
              "src/app/api/conversas/nao-lidas/route.ts",
              '''      usuarioPodeVisualizarAtribuidasDoSetor,\n      usuarioPodeVisualizarEncerradasDoSetor,\n    ] = await Promise.all([\n      podeVisualizarConversasAtribuidasDoSetor(usuario),\n      podeVisualizarConversasEncerradasDoSetorEfetivo(usuario),\n    ]);''',
              '''      usuarioPodeVisualizarAtribuidasDoSetor,\n      usuarioPodeVisualizarEncerradasDoSetor,\n      usuarioPodeVisualizarAtendimentosBot,\n    ] = await Promise.all([\n      podeVisualizarConversasAtribuidasDoSetor(usuario),\n      podeVisualizarConversasEncerradasDoSetorEfetivo(usuario),\n      podeVisualizarAtendimentosBotEfetivo(usuario),\n    ]);''',
              'usuarioPodeVisualizarAtendimentosBot,'
          )
          replace_once(
              "src/app/api/conversas/nao-lidas/route.ts",
              '''      usuarioPodeVisualizarEncerradasSetor:\n        usuarioPodeVisualizarEncerradasDoSetor,\n    });''',
              '''      usuarioPodeVisualizarEncerradasSetor:\n        usuarioPodeVisualizarEncerradasDoSetor,\n      usuarioPodeVisualizarBot: usuarioPodeVisualizarAtendimentosBot,\n    });''',
              'usuarioPodeVisualizarBot: usuarioPodeVisualizarAtendimentosBot'
          )

          # Todo endpoint que chama usuarioPodeVisualizarConversa precisa carregar bot_ativo.
          replace_all(
              "src/app/api/conversas/[id]/informacoes-captura/route.ts",
              'id, empresa_id, contato_id, setor_id, responsavel_id, status, escopo_fila, integracao_whatsapp_id',
              'id, empresa_id, contato_id, setor_id, responsavel_id, bot_ativo, status, escopo_fila, integracao_whatsapp_id'
          )
          replace_all(
              "src/app/api/conversas/[id]/protocolos/route.ts",
              'id, empresa_id, setor_id, responsavel_id, status, escopo_fila, integracao_whatsapp_id',
              'id, empresa_id, setor_id, responsavel_id, bot_ativo, status, escopo_fila, integracao_whatsapp_id'
          )
          replace_all(
              "src/app/api/conversas/[id]/marcar-lida/route.ts",
              'id, empresa_id, setor_id, responsavel_id, status, escopo_fila, integracao_whatsapp_id',
              'id, empresa_id, setor_id, responsavel_id, bot_ativo, status, escopo_fila, integracao_whatsapp_id'
          )
          replace_all(
              "src/app/api/mensagens/[id]/route.ts",
              '  responsavel_id: string | null;\n  status?: string | null;',
              '  responsavel_id: string | null;\n  bot_ativo?: boolean | null;\n  status?: string | null;'
          )
          replace_all(
              "src/app/api/mensagens/[id]/route.ts",
              'id, empresa_id, setor_id, escopo_fila, responsavel_id, status',
              'id, empresa_id, setor_id, escopo_fila, responsavel_id, bot_ativo, status'
          )
          replace_all(
              "src/app/api/mensagens/media/route.ts",
              '  responsavel_id: string | null;\n  status?: string | null;',
              '  responsavel_id: string | null;\n  bot_ativo?: boolean | null;\n  status?: string | null;'
          )
          replace_all(
              "src/app/api/mensagens/media/route.ts",
              'id, empresa_id, setor_id, escopo_fila, responsavel_id, status, origem_atendimento, historico_importado, contato_id, integracao_whatsapp_id',
              'id, empresa_id, setor_id, escopo_fila, responsavel_id, bot_ativo, status, origem_atendimento, historico_importado, contato_id, integracao_whatsapp_id'
          )

          # A rota principal pode ter mais de uma consulta da conversa; completa todas.
          replace_all(
              "src/app/api/mensagens/route.ts",
              'id, empresa_id, setor_id, escopo_fila, responsavel_id, status, origem_atendimento, historico_importado, contato_id, integracao_whatsapp_id',
              'id, empresa_id, setor_id, escopo_fila, responsavel_id, bot_ativo, status, origem_atendimento, historico_importado, contato_id, integracao_whatsapp_id'
          )
          PY

      - name: Auditar chamadas da visibilidade
        shell: bash
        run: |
          echo '=== Chamadas usuarioPodeVisualizarConversa ==='
          grep -RIn --exclude-dir=.git --exclude-dir=node_modules 'usuarioPodeVisualizarConversa' src || true
          echo '=== Selects de conversa nos arquivos que usam a regra ==='
          for f in \
            'src/app/api/conversas/[id]/informacoes-captura/route.ts' \
            'src/app/api/conversas/[id]/protocolos/route.ts' \
            'src/app/api/conversas/[id]/marcar-lida/route.ts' \
            'src/app/api/mensagens/route.ts' \
            'src/app/api/mensagens/media/route.ts' \
            'src/app/api/mensagens/[id]/route.ts'; do
            echo "--- $f"
            grep -n -A2 -B1 'responsavel_id' "$f" || true
          done

      - name: Build
        run: npm ci && npm run build

      - name: Commitar alteracoes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteracao pendente."
            exit 0
          fi
          git config user.name "L34n7"
          git config user.email "86571901+L34n7@users.noreply.github.com"
          git add src
          git commit -m "feat: aplicar permissao de visualizacao do bot"
          git push origin HEAD:feat/permissao-visualizar-atendimentos-bot
