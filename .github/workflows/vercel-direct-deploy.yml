name: Deploy direto Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vercel-direct-deploy.yml

permissions:
  contents: write

concurrency:
  group: vercel-direct-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_5s9Mu6ARKqXqXi5SdVkMcTj8
      VERCEL_PROJECT_ID: prj_uod5BbCEUnUPAnjQWvwGopTDyq3B
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Confirmar credencial Vercel
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo '::error::O secret VERCEL_TOKEN nao esta configurado neste repositorio.'
            exit 1
          fi

      - name: Instalar Vercel CLI
        run: npm install --global vercel@59.10.0

      - name: Preparar commit limpo
        shell: bash
        run: |
          git rm .github/workflows/vercel-direct-deploy.yml
          git config user.name "L34n7"
          git config user.email "86571901+L34n7@users.noreply.github.com"
          git commit -m 'chore: publicar intencoes em producao'

      - name: Carregar configuracao de producao
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build de producao
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy de producao
        shell: bash
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployment: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "VERCEL_DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"

      - name: Publicar commit limpo na main
        run: git push origin HEAD:main
