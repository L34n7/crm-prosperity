name: ajustar-arbitragem-rodando

on:
  push:
    branches: ["tmp/arbitragem-hibrida-rodando-20260902"]

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/arbitragem-hibrida-rodando-20260902
          fetch-depth: 0
      - name: ajustar
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/automacoes/process-automation-engine.ts')
          s = p.read_text()
          antigo = '''              if (contexto.fluxoAindaRodando) {\n                const resultadoAgente = await interceptarMensagemAgenteIa(inputReavaliado);\n                if (resultadoAgente) {\n                  return { acao: "concluir" as const, resultado: resultadoAgente };\n                }\n                return {\n                  acao: "adiar" as const,\n                  motivo: "fluxo_ainda_rodando_sem_agente_disponivel",\n                };\n              }\n'''
          novo = '''              if (contexto.fluxoAindaRodando) {\n                // Nunca permitimos o Agente assumir enquanto o Fluxo ainda esta\n                // executando. A mensagem permanece persistida e a fila reavalia\n                // depois, evitando duas respostas concorrentes.\n                return {\n                  acao: "adiar" as const,\n                  motivo: "fluxo_ainda_rodando",\n                };\n              }\n'''
          if antigo not in s:
              raise SystemExit('bloco esperado nao encontrado')
          p.write_text(s.replace(antigo, novo, 1))
          PY
      - name: registrar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ajustar-arbitragem-rodando.yml
          git add src/lib/automacoes/process-automation-engine.ts
          git commit -m "fix: manter mensagem pendente enquanto fluxo roda"
          git push origin HEAD:tmp/arbitragem-hibrida-rodando-20260902
