name: Fix conversas atribuicao

on:
  push:
    branches:
      - fix/conversas-atribuicao-usuarios

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correcao
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/app/(private)/conversas/page.tsx';
          let content = fs.readFileSync(path, 'utf8');

          function replaceOnce(search, replacement, label) {
            const first = content.indexOf(search);
            if (first === -1) {
              throw new Error(`Trecho nao encontrado: ${label}`);
            }
            const second = content.indexOf(search, first + search.length);
            if (second !== -1) {
              throw new Error(`Trecho duplicado inesperadamente: ${label}`);
            }
            content = content.slice(0, first) + replacement + content.slice(first + search.length);
          }

          replaceOnce(
            '  const [usuarios, setUsuarios] = useState<UsuarioOpcao[]>([]);\n  const [integracoesWhatsapp, setIntegracoesWhatsapp] = useState<\n',
            '  const [usuarios, setUsuarios] = useState<UsuarioOpcao[]>([]);\n  const [carregandoUsuariosAtribuicao, setCarregandoUsuariosAtribuicao] =\n    useState(false);\n  const [integracoesWhatsapp, setIntegracoesWhatsapp] = useState<\n',
            'estado de usuarios da atribuicao'
          );

          replaceOnce(
            `  async function carregarUsuariosPorSetor(setorId: string) {\n    try {\n      const res = await fetch(\n        \`/api/usuarios/opcoes-atribuicao?setor_id=\${setorId}\`,\n        { cache: "no-store" }\n      );\n\n      const data = await res.json();\n\n      if (!res.ok) {\n        setUsuarios([]);\n        return;\n      }\n\n      setUsuarios(data.usuarios || []);\n    } catch {\n      setUsuarios([]);\n    }\n  }\n`,
            `  async function carregarUsuariosPorSetor(setorId: string) {\n    const setorNormalizado = setorId.trim();\n\n    if (!setorNormalizado) {\n      setUsuarios([]);\n      setCarregandoUsuariosAtribuicao(false);\n      return;\n    }\n\n    try {\n      setCarregandoUsuariosAtribuicao(true);\n\n      const res = await fetch(\n        \`/api/usuarios/opcoes-atribuicao?setor_id=\${encodeURIComponent(\n          setorNormalizado\n        )}\`,\n        { cache: "no-store" }\n      );\n\n      const data = await res.json();\n\n      if (!res.ok) {\n        setUsuarios([]);\n        setErro(data.error || "Erro ao carregar usuários do setor.");\n        return;\n      }\n\n      setUsuarios(Array.isArray(data.usuarios) ? data.usuarios : []);\n    } catch {\n      setUsuarios([]);\n      setErro("Erro ao carregar usuários do setor.");\n    } finally {\n      setCarregandoUsuariosAtribuicao(false);\n    }\n  }\n`,
            'carregar usuarios por setor'
          );

          replaceOnce(
            `  async function confirmarAtribuicao() {\n    if (!novoResponsavelId || !conversaSelecionada?.id) {\n      setErro("Selecione um responsável.");\n      return;\n    }\n`,
            `  async function confirmarAtribuicao() {\n    if (!novoSetorId) {\n      setErro("Selecione um setor.");\n      return;\n    }\n\n    if (!novoResponsavelId || !conversaSelecionada?.id) {\n      setErro("Selecione um responsável.");\n      return;\n    }\n`,
            'validacao da atribuicao'
          );

          replaceOnce(
            `          body: JSON.stringify({\n            responsavel_id: novoResponsavelId,\n          }),\n        }\n      );\n\n      const data = await res.json();\n\n      if (!res.ok) {\n        setErro(data.error || "Erro ao atribuir responsável");\n`,
            `          body: JSON.stringify({\n            setor_id: novoSetorId,\n            responsavel_id: novoResponsavelId,\n          }),\n        }\n      );\n\n      const data = await res.json();\n\n      if (!res.ok) {\n        setErro(data.error || "Erro ao atribuir responsável");\n`,
            'payload da atribuicao'
          );

          replaceOnce(
            `  async function abrirAtribuir() {\n    setErro("");\n    setMensagemSucesso("");\n\n    const setorAtual =\n      conversaSelecionada?.setor_id || conversaSelecionada?.setores?.id || "";\n\n    setNovoResponsavelId(\n      conversaSelecionada?.responsavel_id ||\n        conversaSelecionada?.responsavel?.id ||\n        ""\n    );\n\n    setAcaoAberta("atribuir");\n\n    if (setorAtual) {\n      await carregarUsuariosPorSetor(setorAtual);\n    } else {\n      setUsuarios([]);\n    }\n  }\n`,
            `  async function abrirAtribuir() {\n    setErro("");\n    setMensagemSucesso("");\n\n    const setorAtual =\n      conversaSelecionada?.setor_id || conversaSelecionada?.setores?.id || "";\n\n    setNovoSetorId(setorAtual);\n    setNovoResponsavelId(\n      conversaSelecionada?.responsavel_id ||\n        conversaSelecionada?.responsavel?.id ||\n        ""\n    );\n    setUsuarios([]);\n    setAcaoAberta("atribuir");\n\n    if (setorAtual) {\n      await carregarUsuariosPorSetor(setorAtual);\n    }\n  }\n`,
            'abertura do painel de atribuicao'
          );

          const assignMarker = '{acaoAberta === "atribuir" && (';
          const assignIndex = content.indexOf(assignMarker);
          if (assignIndex === -1) {
            throw new Error('Painel de atribuicao nao encontrado');
          }

          const beforeAssign = content.slice(0, assignIndex);
          let assignTail = content.slice(assignIndex);

          const sectorOnChange = 'onChange={(e) => setNovoSetorId(e.target.value)}';
          const sectorOnChangeIndex = assignTail.indexOf(sectorOnChange);
          if (sectorOnChangeIndex === -1) {
            throw new Error('onChange do setor da atribuicao nao encontrado');
          }

          const sectorOnChangeReplacement = `onChange={(e) => {\n                                const setorId = e.target.value;\n                                setNovoSetorId(setorId);\n                                setNovoResponsavelId("");\n                                setUsuarios([]);\n\n                                if (setorId) {\n                                  void carregarUsuariosPorSetor(setorId);\n                                } else {\n                                  setCarregandoUsuariosAtribuicao(false);\n                                }\n                              }}`;

          assignTail =
            assignTail.slice(0, sectorOnChangeIndex) +
            sectorOnChangeReplacement +
            assignTail.slice(sectorOnChangeIndex + sectorOnChange.length);

          const responsibleSelect = `                              value={novoResponsavelId}\n                              onChange={(e) => setNovoResponsavelId(e.target.value)}\n                              className={styles.actionSelect}\n                            >\n                              <option value="">Selecione um responsável</option>`;
          const responsibleSelectIndex = assignTail.indexOf(responsibleSelect);
          if (responsibleSelectIndex === -1) {
            throw new Error('Select de responsavel da atribuicao nao encontrado');
          }

          const responsibleSelectReplacement = `                              value={novoResponsavelId}\n                              onChange={(e) => setNovoResponsavelId(e.target.value)}\n                              className={styles.actionSelect}\n                              disabled={!novoSetorId || carregandoUsuariosAtribuicao}\n                            >\n                              <option value="">\n                                {carregandoUsuariosAtribuicao\n                                  ? "Carregando usuários..."\n                                  : !novoSetorId\n                                  ? "Selecione um setor primeiro"\n                                  : usuariosFiltradosPorSetor.length === 0\n                                  ? "Nenhum usuário disponível"\n                                  : "Selecione um responsável"}\n                              </option>`;

          assignTail =
            assignTail.slice(0, responsibleSelectIndex) +
            responsibleSelectReplacement +
            assignTail.slice(responsibleSelectIndex + responsibleSelect.length);

          content = beforeAssign + assignTail;
          fs.writeFileSync(path, content);
          NODE

      - name: Validar diff
        shell: bash
        run: |
          git diff --check
          git diff -- src/app/'(private)'/conversas/page.tsx

      - name: Commitar correcao
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-conversas-atribuicao.yml
          git add src/app/'(private)'/conversas/page.tsx
          git commit -m "fix: corrigir selecao de usuario na atribuicao de conversa"
          git push origin HEAD:fix/conversas-atribuicao-usuarios
