name: Corrigir autoria para Vercel

# Segunda gravacao intencional para disparar o workflow ja existente na main.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vercel-author-fix.yml

permissions:
  contents: write

concurrency:
  group: vercel-author-fix
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar ESLint
        run: npm run lint

      - name: Validar TypeScript
        run: npx tsc --noEmit

      - name: Validar build Next.js
        run: npm run build

      - name: Publicar commit final
        shell: bash
        run: |
          rm .github/workflows/vercel-author-fix.yml
          git config user.name "L34n7"
          git config user.email "86571901+L34n7@users.noreply.github.com"
          git add .github/workflows/vercel-author-fix.yml
          git commit -m 'chore: publicar intencoes na Vercel'
          git push origin HEAD:main
