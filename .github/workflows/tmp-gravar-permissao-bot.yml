name: Gravar implementacao permissao bot

on:
  push:
    branches:
      - feat/permissao-visualizar-atendimentos-bot

permissions:
  contents: write

jobs:
  apply-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/permissao-visualizar-atendimentos-bot
          fetch-depth: 0

      - name: Aplicar implementacao validada
        shell: bash
        run: |
          sed -n "/^          python <<'PY'$/,/^          PY$/p" .github/workflows/tmp-aplicar-permissao-bot-final.yml \
            | sed '1d;$d;s/^          //' \
            | python

      - name: Commitar codigo
        shell: bash
        run: |
          git config user.name "L34n7"
          git config user.email "86571901+L34n7@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "Codigo ja aplicado."
            exit 0
          fi
          git commit -m "feat: aplicar permissao de visualizacao do bot"
          git push origin HEAD:feat/permissao-visualizar-atendimentos-bot
