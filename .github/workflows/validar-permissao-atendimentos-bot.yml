name: Validar permissao atendimentos bot

on:
  push:
    branches:
      - feat/permissao-visualizar-atendimentos-bot

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/permissao-visualizar-atendimentos-bot
          fetch-depth: 0

      - name: Reaplicar alteracoes anteriores
        shell: bash
        run: |
          sed -n "/python <<'PY'/,/^          PY$/p" .github/workflows/aplicar-permissao-atendimentos-bot.yml \
            | sed '1d;$d;s/^          //' | python
          sed -n "/python <<'PY'/,/^          PY$/p" .github/workflows/finalizar-permissao-atendimentos-bot.yml \
            | sed '1d;$d;s/^          //' | python

      - name: Alinhar header e segunda consulta de mensagens
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, marker=None):
              p = Path(path)
              text = p.read_text()
              if marker and marker in text:
                  print(f"{path}: ja aplicado")
                  return
              if old not in text:
                  raise SystemExit(f"Padrao nao encontrado em {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))
              print(f"{path}: atualizado")

          # O resumo do header usa o mesmo contador de não lidas.
          replace_once(
              "src/app/api/header/resumo/route.ts",
              '''import {\n  podeVisualizarConversasAtribuidasDoSetor,\n  podeVisualizarConversasEncerradasDoSetorEfetivo,\n} from "@/lib/conversas/visibilidade";''',
              '''import {\n  podeVisualizarAtendimentosBotEfetivo,\n  podeVisualizarConversasAtribuidasDoSetor,\n  podeVisualizarConversasEncerradasDoSetorEfetivo,\n} from "@/lib/conversas/visibilidade";''',
              'podeVisualizarAtendimentosBotEfetivo,'
          )
          replace_once(
              "src/app/api/header/resumo/route.ts",
              '''  usuarioPodeAtribuir: boolean;\n  usuarioPodeVisualizarEncerradasSetor: boolean;\n}) {''',
              '''  usuarioPodeAtribuir: boolean;\n  usuarioPodeVisualizarEncerradasSetor: boolean;\n  usuarioPodeVisualizarBot: boolean;\n}) {''',
              'usuarioPodeVisualizarBot: boolean;'
          )
          replace_once(
              "src/app/api/header/resumo/route.ts",
              '''    usuarioPodeVisualizarAtribuidasDoSetor,\n    usuarioPodeVisualizarEncerradasDoSetor,\n  ] = podeVerConversas\n    ? await Promise.all([\n        podeVisualizarConversasAtribuidasDoSetor(usuario),\n        podeVisualizarConversasEncerradasDoSetorEfetivo(usuario),\n      ])\n    : [false, false];''',
              '''    usuarioPodeVisualizarAtribuidasDoSetor,\n    usuarioPodeVisualizarEncerradasDoSetor,\n    usuarioPodeVisualizarAtendimentosBot,\n  ] = podeVerConversas\n    ? await Promise.all([\n        podeVisualizarConversasAtribuidasDoSetor(usuario),\n        podeVisualizarConversasEncerradasDoSetorEfetivo(usuario),\n        podeVisualizarAtendimentosBotEfetivo(usuario),\n      ])\n    : [false, false, false];''',
              'usuarioPodeVisualizarAtendimentosBot,'
          )
          replace_once(
              "src/app/api/header/resumo/route.ts",
              '''          usuarioPodeVisualizarEncerradasSetor:\n            usuarioPodeVisualizarEncerradasDoSetor,\n        })''',
              '''          usuarioPodeVisualizarEncerradasSetor:\n            usuarioPodeVisualizarEncerradasDoSetor,\n          usuarioPodeVisualizarBot: usuarioPodeVisualizarAtendimentosBot,\n        })''',
              'usuarioPodeVisualizarBot: usuarioPodeVisualizarAtendimentosBot'
          )

          # A rota principal de mensagens possui uma segunda consulta usada no POST.
          replace_once(
              "src/app/api/mensagens/route.ts",
              '''      "id, empresa_id, setor_id, escopo_fila, responsavel_id, status, contato_id, integracao_whatsapp_id"''',
              '''      "id, empresa_id, setor_id, escopo_fila, responsavel_id, bot_ativo, status, contato_id, integracao_whatsapp_id"''',
              'responsavel_id, bot_ativo, status, contato_id'
          )
          PY

      - name: Auditar integracao da permissao
        shell: bash
        run: |
          echo '=== Permissao ==='
          grep -RIn --exclude-dir=.git --exclude-dir=node_modules 'visualizar_atendimentos_bot' src supabase/migrations
          echo '=== Chamadas do contador ==='
          grep -RIn --exclude-dir=.git --exclude-dir=node_modules 'contarConversasNaoLidas' src
          echo '=== Consultas em arquivos que usam usuarioPodeVisualizarConversa ==='
          for f in $(grep -Rl --exclude-dir=.git --exclude-dir=node_modules 'usuarioPodeVisualizarConversa' src/app); do
            echo "--- $f"
            grep -n -A2 -B1 'responsavel_id' "$f" || true
          done

      - name: Build
        run: npm ci && npm run build

      - name: Commitar alteracoes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteracao pendente."
            exit 0
          fi
          git config user.name "L34n7"
          git config user.email "86571901+L34n7@users.noreply.github.com"
          git add src
          git commit -m "feat: aplicar permissao de visualizacao do bot"
          git push origin HEAD:feat/permissao-visualizar-atendimentos-bot
