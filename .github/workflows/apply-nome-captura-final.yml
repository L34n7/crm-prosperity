name: Apply nome captura final

on:
  push:
    branches:
      - feature/nome-captura-disparos-main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nome-captura-disparos-main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply source changes
        shell: bash
        run: |
          set -euo pipefail
          git show 6249a6902a97251a6cfc4508d30ce074a13a0b96 --format= --binary -- \
            'src/app/(private)/conversas/page.tsx' \
            'src/app/(private)/disparos-whatsapp/page.tsx' \
            'src/app/api/whatsapp/disparo-individual/route.ts' \
            'src/lib/automacoes/variaveis-fixas-contato.ts' \
            'src/lib/whatsapp/disparo-agendado-variaveis.ts' \
            'src/lib/whatsapp/send-template-disparo.ts' \
            | git apply -3

          python3 <<'PY'
          from pathlib import Path
          p = Path('src/app/api/whatsapp/disparo-individual/route.ts')
          text = p.read_text()
          old1 = 'if (bodyParams.some((valor) => extrairChaveNomeCaptura(valor))) {'
          new1 = 'if (bodyParams.some((valor: string) => extrairChaveNomeCaptura(valor))) {'
          old2 = 'bodyParams = bodyParams.map((valor) => {'
          new2 = 'bodyParams = bodyParams.map((valor: string) => {'
          if text.count(old1) != 1:
              raise RuntimeError(f'expected one some callback, found {text.count(old1)}')
          if text.count(old2) != 1:
              raise RuntimeError(f'expected one map callback, found {text.count(old2)}')
          text = text.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(text)
          PY

          git rm .github/workflows/apply-nome-captura-final.yml
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > /tmp/tsc.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'TypeScript clean.'
            exit 0
          fi
          grep 'error TS' /tmp/tsc.log \
            | grep -v 'tests/assistente-fluxos-planejamento.test.mts' \
            | grep -v 'tests/assistente-fluxos-resiliencia.test.mts' \
            > /tmp/tsc-new.log || true
          if [ -s /tmp/tsc-new.log ]; then
            echo 'New TypeScript errors:'
            cat /tmp/tsc-new.log
            exit 1
          fi
          echo 'Only known baseline test errors remain.'

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CRM Prosperity Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: adicionar nome capturado aos disparos'
          git push origin HEAD:feature/nome-captura-disparos-main
